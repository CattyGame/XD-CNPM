# AURA Centralized Redis Cache Configuration (Sprint 4-5)
# Redis 7.2+ Production Standards

# Network & Security
bind 0.0.0.0
port 6379
protected-mode yes
requirepass aura_redis_secret_pass
timeout 300
tcp-keepalive 60

# Persistence: Hybrid RDB + AOF
# RDB Snapshots
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# AOF (Append Only File) Persistence
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-load-truncated yes
aof-use-rdb-preamble yes

# Memory Management & Eviction
maxmemory 512mb
maxmemory-policy volatile-lru
maxmemory-samples 5

# Logging & Performance
loglevel notice
logfile ""
databases 16
