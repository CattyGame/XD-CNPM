global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'service', 'severity']
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 1h
  receiver: 'aura-notifications'

receivers:
  - name: 'aura-notifications'
    webhook_configs:
      - url: 'http://localhost:5000/api/v1/alerts/webhook'
        send_resolved: true
