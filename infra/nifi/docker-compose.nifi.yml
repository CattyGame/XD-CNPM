services:
  nifi:
    image: apache/nifi:1.27.0
    container_name: aura-nifi
    ports:
      - "127.0.0.1:8443:8443"    # NiFi Web UI HTTPS
      - "127.0.0.1:8081:8081"    # Camera Ingestion HTTP Port
    environment:
      NIFI_WEB_HTTPS_PORT: "8443"
      AUTH: single-user
      SINGLE_USER_CREDENTIALS_USERNAME: "${NIFI_ADMIN_USER:?Set NIFI_ADMIN_USER in .env}"
      SINGLE_USER_CREDENTIALS_PASSWORD: "${NIFI_ADMIN_PASSWORD:?Set NIFI_ADMIN_PASSWORD in .env}"
    volumes:
      - nifi_conf:/opt/nifi/nifi-current/conf
      - nifi_flowfile_repository:/opt/nifi/nifi-current/flowfile_repository
      - nifi_content_repository:/opt/nifi/nifi-current/content_repository
      - nifi_provenance_repository:/opt/nifi/nifi-current/provenance_repository
      - nifi_quarantine:/opt/nifi/quarantine
    networks:
      - aura_network
    restart: unless-stopped

networks:
  aura_network:
    name: ${AURA_DOCKER_NETWORK:-aura_network}
    external: true

volumes:
  nifi_conf:
  nifi_flowfile_repository:
  nifi_content_repository:
  nifi_provenance_repository:
  nifi_quarantine:
