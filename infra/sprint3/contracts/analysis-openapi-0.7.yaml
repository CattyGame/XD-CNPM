openapi: 3.0.3
info:
  title: AURA Analysis API
  version: 0.7.0
  description: Sprint3 target contract; inherited upload and GET shapes, nullable
    risk for Frangi. Not a declaration that runtime endpoints are already implemented.
  x-change-notes:
  - 0.6.0 thay đổi ràng buộc và trường response bắt buộc; cập nhật fixtures/examples
    và thông báo các bên trước khi khóa baseline.
servers:
- url: http://127.0.0.1:5300
tags:
- name: Analyses
- name: Reviews
- name: Reports
security:
- bearerAuth: []
paths:
  /api/v1/analyses:
    post:
      tags:
      - Analyses
      operationId: createAnalysis
      summary: Tạo yêu cầu phân tích (1..N ảnh, mỗi ảnh một analysis)
      description: 'Role chỉ là kiểm tra chức năng. Backend còn kiểm tra tenant đang
        hoạt động và OWN/ASSIGNED/TENANT trên từng resource. Role bị cấm trả 403;
        tài nguyên không tồn tại/ngoài phạm vi trả cùng 404. tenantId/ownerId/requesterId
        do client gửi không cấp quyền. SYSTEM_ADMIN không được dùng endpoint này.
        Trả 202 với batchId và danh sách analysisId theo từng ảnh. Bắt buộc header
        `Idempotency-Key`.

        Luồng: kiểm tra quyền, ảnh và credit (hỏi Billing qua API) -> lưu ảnh vào
        private object storage -> lưu analysis, job và outbox trong cùng transaction
        -> trả 202. Outbox publisher phát job lên hàng đợi sau đó (ADR-003).

        Gửi lại cùng key và cùng nội dung: trả lại phản hồi gốc (header `Idempotent-Replayed:
        true`), không tạo job hay trừ credit lần nữa (BR-10). Cùng key, nội dung khác:
        409 ERR_IDEMPOTENCY_KEY_REUSED.

        Ảnh trùng (theo checksum): item có processingStatus DUPLICATE kèm existingAnalysisId.

        Idempotency được phạm vi hóa theo (tenantId, requesterId, Idempotency-Key),
        có unique constraint tương ứng. Kiểm tra quyền hiện hành trước khi replay.
        Requester khác cùng tenant dùng cùng key không replay dữ liệu người trước.

        Fingerprint là SHA-256 của metadata nghiệp vụ chuẩn hóa (patientId, modality,
        eyeSide) và checksum từng ảnh theo thứ tự request; áp mặc định trước khi tính,
        version hóa cách chuẩn hóa; không gồm token, correlationId hay timestamp.
        Hai request đồng thời chỉ tạo một logical resource và một reservation hợp
        lệ; request thua tranh chấp đọc phản hồi đã commit hoặc nhận 409 ERR_REQUEST_IN_PROGRESS
        để gửi lại cùng key.

        NiFi dùng service token có scope analysis:ingest và tenant được cấp; không
        dùng role DOCTOR để vượt quyền. Chỉ được tạo cho bệnh nhân trong tenant. JWT
        claim scope là danh sách phân tách bằng dấu cách; backend phải kiểm tra scope
        và quyền bệnh nhân.

        Camera ingestion is opt-in and currently supports one image per request for
        an ACTIVE/READY personal Patient delegation. The backend verifies the delegated
        account, patient and tenant through Profile/Identity before reserve or replay.
        NiFi must supply X-Aura-Camera-Device and should supply X-Aura-Camera-Patient;
        camera query/clinic selectors are rejected. Requester remains the verified
        delegated account for existing Billing policy, while a separate atomic audit
        records the service principal/device. Camera fingerprints additionally bind
        the authenticated service/client/device/tenant in a camera-v1 domain; user
        fingerprints are unchanged.

        Multipart gửi repeated field images (binary JPEG/PNG), patientId (UUID), eyeSide
        và modality. OCT bị 400 trước job/hold credit. accepted items thông thường
        ở QUEUED sau transaction chứa Job/Outbox; replay không biến item cũ thành
        DUPLICATE.'
      parameters:
      - $ref: '#/components/parameters/ClinicContext'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CorrelationId'
      - name: X-Aura-Camera-Device
        in: header
        required: false
        description: Required for NiFi service ingestion; an untrusted selector verified
          against service JWT and server grants. Not used for user login.
        schema:
          type: string
          maxLength: 128
      - name: X-Aura-Camera-Patient
        in: header
        required: false
        description: Patient UUID selector for a device with multiple grants; must
          match multipart patientId and an active server delegation. Never grants
          permission itself.
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateAnalysisRequest'
            encoding:
              images:
                contentType: image/jpeg, image/png
      responses:
        '202':
          description: Đã nhận, đang xếp hàng
          headers:
            Idempotent-Replayed:
              description: true nếu đây là phản hồi phát lại
              schema:
                type: boolean
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisAccepted'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/InsufficientCredit'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMedia'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '404':
          $ref: '#/components/responses/NotFound'
      x-roles:
      - PATIENT
      - DOCTOR
      - CLINIC_ADMIN
      x-resource-scopes:
        PATIENT: OWN
        DOCTOR: ASSIGNED
        CLINIC_ADMIN: TENANT
      x-service-scopes:
      - analysis:ingest
  /api/v1/analyses/{analysisId}:
    get:
      tags:
      - Analyses
      operationId: getAnalysis
      summary: Lấy trạng thái và kết quả
      description: Role chỉ là kiểm tra chức năng. Backend còn kiểm tra tenant đang
        hoạt động và OWN/ASSIGNED/TENANT trên từng resource. Role bị cấm trả 403;
        tài nguyên không tồn tại/ngoài phạm vi trả cùng 404. tenantId/ownerId/requesterId
        do client gửi không cấp quyền. SYSTEM_ADMIN không được dùng endpoint này.
        Client poll. `result` chỉ có khi processingStatus là COMPLETED. `error` có
        khi FAILED, LOW_QUALITY, REJECTED, DUPLICATE. Không có quyền hoặc không tồn
        tại đều trả 404 (BR-02); 403 cho vai trò không được dùng chức năng.
      parameters:
      - $ref: '#/components/parameters/AnalysisId'
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Analysis'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      x-roles:
      - PATIENT
      - DOCTOR
      - CLINIC_ADMIN
      x-resource-scopes:
        PATIENT: OWN
        DOCTOR: ASSIGNED
        CLINIC_ADMIN: TENANT
  /api/v1/batches/{batchId}:
    get:
      tags:
      - Analyses
      operationId: getBatch
      summary: Trạng thái từng ảnh trong batch
      parameters:
      - $ref: '#/components/parameters/ClinicContext'
      - name: batchId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Batch'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      x-roles:
      - PATIENT
      - DOCTOR
      - CLINIC_ADMIN
      description: Role chỉ là kiểm tra chức năng. Backend còn kiểm tra tenant đang
        hoạt động và OWN/ASSIGNED/TENANT trên từng resource. Role bị cấm trả 403;
        tài nguyên không tồn tại/ngoài phạm vi trả cùng 404. tenantId/ownerId/requesterId
        do client gửi không cấp quyền. SYSTEM_ADMIN không được dùng endpoint này.
        Mỗi item có trạng thái, job và kết quả/lỗi riêng. Ảnh lỗi không làm hỏng các
        ảnh khác (PARTIAL_FAILED). batchStatus và summary được tính theo quy tắc Batch/BatchSummary;
        một batch hiện thuộc cùng bệnh nhân. Không công bố số đếm ngoài quyền actor.
      x-resource-scopes:
        PATIENT: OWN
        DOCTOR: ASSIGNED
        CLINIC_ADMIN: TENANT
  /api/v1/analyses/{analysisId}/files/{fileId}/access:
    get:
      tags:
      - Analyses
      operationId: getFileAccess
      summary: Xin quyền đọc ảnh hoặc annotation riêng tư
      description: 'Role chỉ là kiểm tra chức năng. Backend còn kiểm tra tenant đang
        hoạt động và OWN/ASSIGNED/TENANT trên từng resource. Role bị cấm trả 403;
        tài nguyên không tồn tại/ngoài phạm vi trả cùng 404. tenantId/ownerId/requesterId
        do client gửi không cấp quyền. SYSTEM_ADMIN không được dùng endpoint này.
        Backend kiểm tra tenant, ownership và phân công bác sĩ trên analysis rồi mới
        cấp URL ký có thời hạn. Không có quyền hoặc không tồn tại: 404.'
      x-roles:
      - PATIENT
      - DOCTOR
      - CLINIC_ADMIN
      parameters:
      - $ref: '#/components/parameters/ClinicContext'
      - $ref: '#/components/parameters/AnalysisId'
      - name: fileId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileAccess'
          headers:
            Cache-Control:
              description: Read-only SAS response must not be cached
              schema:
                type: string
                enum:
                - no-store
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      x-resource-scopes:
        PATIENT: OWN
        DOCTOR: ASSIGNED
        CLINIC_ADMIN: TENANT
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'JWT đã xác minh từ Identity: sub, tenantId và role đối với người
        dùng hoặc scope đối với service. Không tin tenant client gửi. analysis:ingest
        chỉ cấp cho service tạo analysis trong tenant được phép.'
  parameters:
    ClinicContext:
      name: clinicContextId
      in: query
      required: false
      description: Optional clinic selector; Profile must authorize patient/assignment/tenant.
        This value grants no permission.
      schema:
        type: string
        format: uuid
    AnalysisId:
      name: analysisId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID ổn định cho cùng request. Phạm vi (tenantId, requesterId,
        key); cùng payload replay sau kiểm tra quyền, khác payload 409.
      schema:
        type: string
        format: uuid
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: Mã theo dõi xuyên dịch vụ. Nếu thiếu, Gateway/API tự sinh. Được
        trả lại trong error.correlationId và ghi vào event/job.correlationId.
      schema:
        type: string
        maxLength: 64
  schemas:
    ProcessingStatus:
      type: string
      enum: &id001
      - PENDING
      - QUEUED
      - PROCESSING
      - COMPLETED
      - FAILED
      - RETRY_READY
      - LOW_QUALITY
      - REJECTED
      - DUPLICATE
      description: Theo State Machine SCRUM-52 (nhóm Analysis, Analysis error, Validation).
    RiskLevel:
      type: string
      enum:
      - LOW
      - MODERATE
      - HIGH
      description: Khớp output AI của M4.
    CreateAnalysisRequest:
      type: object
      required:
      - patientId
      - images
      properties:
        patientId:
          type: string
          format: uuid
        images:
          type: array
          minItems: 1
          items:
            type: string
            format: binary
          description: 1..N ảnh đáy mắt (JPEG/PNG). Mỗi ảnh tạo một analysis riêng,
            cùng một batchId. Ảnh lưu object storage, DB chỉ giữ tham chiếu.
        modality:
          type: string
          enum:
          - FUNDUS
          default: FUNDUS
          description: Chỉ FUNDUS; OCT hoặc giá trị khác trả 400 ERR_VALIDATION trước
            job và hold credit.
        eyeSide:
          type: string
          enum:
          - left
          - right
          - unknown
          default: unknown
      description: Một batch của cùng patientId. Backend xác minh quan hệ bệnh nhân/principal
        hoặc assignment/tenant; không mặc định patientId = token.sub.
      additionalProperties: false
    AnalysisAccepted:
      type: object
      required:
      - batchId
      - items
      - createdAt
      - statusUrl
      properties:
        batchId:
          type: string
          format: uuid
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/BatchItem'
        createdAt:
          type: string
          format: date-time
        statusUrl:
          type: string
          description: URL batch; mỗi item có URL analysis riêng /api/v1/analyses/{analysisId}
      additionalProperties: false
    AnalysisResult:
      type: object
      required:
      - riskLevel
      - riskScore
      - confidenceScore
      - isMock
      - modelVersion
      - configVersion
      - thresholdVersion
      - disclaimer
      - version
      - riskAvailable
      - metrics
      - annotations
      - warnings
      - limitations
      - indicators
      - processingTimeMs
      properties:
        riskLevel:
          type: string
          nullable: true
          enum:
          - LOW
          - MODERATE
          - HIGH
          - null
        riskScore:
          type: number
          minimum: 0
          maximum: 1
          nullable: true
        confidenceScore:
          type: number
          minimum: 0
          maximum: 1
          nullable: true
        metrics:
          $ref: '#/components/schemas/Metrics'
        indicators:
          type: array
          items:
            type: string
        modelVersion:
          type: string
        disclaimer:
          type: string
        isMock:
          type: boolean
          description: true khi là dữ liệu giả lập (ADR-008)
        thresholdVersion:
          type: string
          description: Phiên bản ngưỡng (NFR-23)
        annotations:
          type: array
          items:
            $ref: '#/components/schemas/FileRef'
          description: FileRef với fileId và kind. Runtime hiện chỉ tạo kind mask/overlay;
            kind khác dự phòng, không tự sinh. Annotation khớp kích thước ảnh gốc.
        configVersion:
          type: string
          description: Phiên bản cấu hình/ngưỡng áp dụng (NFR-23, ADR-008)
        version:
          type: integer
          minimum: 1
          description: Version kết quả AI theo ảnh; dùng để xác định kết quả được
            review.
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/Warning'
          description: Cảnh báo của kết quả hợp lệ. WARNING không tự đồng nghĩa LOW_QUALITY.
        processingTimeMs:
          type: number
          minimum: 0
          description: Ánh xạ AI processing_time_ms; chỉ thời gian component, không
            phải NFR toàn luồng.
        limitations:
          type: string
          description: Giới hạn nguồn AI; không biến mock thành kết quả thật.
        riskAvailable:
          type: boolean
      additionalProperties: false
      description: riskAvailable=false requires all risk fields null and indicators
        empty. isMock=false denotes real engine output; not clinical certification.
      oneOf:
      - type: object
        properties:
          riskAvailable:
            type: boolean
            enum:
            - false
          riskLevel:
            type: string
            nullable: true
            enum:
            - null
          riskScore:
            type: number
            nullable: true
            enum:
            - null
          confidenceScore:
            type: number
            nullable: true
            enum:
            - null
          indicators:
            type: array
            maxItems: 0
            items:
              type: string
      - type: object
        properties:
          riskAvailable:
            type: boolean
            enum:
            - true
          riskLevel:
            type: string
            enum:
            - LOW
            - MODERATE
            - HIGH
          riskScore:
            type: number
            minimum: 0
            maximum: 1
          confidenceScore:
            type: number
            minimum: 0
            maximum: 1
    Analysis:
      type: object
      required:
      - analysisId
      - batchId
      - patientId
      - processingStatus
      - reviewStatus
      - createdAt
      - updatedAt
      properties:
        analysisId:
          type: string
          format: uuid
        patientId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        result:
          $ref: '#/components/schemas/AnalysisResult'
        latestReview:
          $ref: '#/components/schemas/Review'
        batchId:
          type: string
          format: uuid
        processingStatus:
          $ref: '#/components/schemas/ProcessingStatus'
        reviewStatus:
          $ref: '#/components/schemas/ReviewStatus'
        error:
          $ref: '#/components/schemas/ErrorInfo'
        existingAnalysisId:
          type: string
          format: uuid
          description: Có khi DUPLICATE
        ownerId:
          type: string
          format: uuid
          description: Principal sở hữu resource theo policy; không mặc định là requester.
        image:
          $ref: '#/components/schemas/FileRef'
        job:
          $ref: '#/components/schemas/Job'
        requesterId:
          type: string
          format: uuid
          description: Principal tạo request, được backend xác định.
      additionalProperties: false
    AnalysisList:
      type: object
      required:
      - items
      - page
      - pageSize
      - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Analysis'
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
      additionalProperties: false
    ReviewRequest:
      description: 'Hai nhánh loại trừ: xác nhận chỉ isApproved/baseVersion/doctorNotes;
        hiệu chỉnh bắt buộc correctedRiskLevel và reason có ký tự không phải khoảng
        trắng. Backend trim và kiểm tra quyền/version trong transaction.'
      oneOf:
      - type: object
        title: Confirm AI result
        required:
        - isApproved
        - baseVersion
        properties:
          isApproved:
            type: boolean
            enum:
            - true
            description: Xác nhận kết quả AI hiện tại.
          baseVersion:
            type: integer
            minimum: 0
            description: Phiên bản review hiện tại; lệch => 409 ERR_CONCURRENT_REVIEW.
          doctorNotes:
            type: string
            maxLength: 2000
        additionalProperties: false
      - type: object
        title: Correct AI result
        required:
        - isApproved
        - baseVersion
        - correctedRiskLevel
        - reason
        properties:
          isApproved:
            type: boolean
            enum:
            - false
            description: Bác sĩ không chấp nhận kết quả AI và thực hiện hiệu chỉnh.
          baseVersion:
            type: integer
            minimum: 0
            description: Phiên bản review hiện tại; lệch => 409 ERR_CONCURRENT_REVIEW.
          correctedRiskLevel:
            $ref: '#/components/schemas/RiskLevel'
          doctorNotes:
            type: string
            maxLength: 2000
          reason:
            type: string
            minLength: 1
            maxLength: 1000
            description: Bắt buộc khi hiệu chỉnh (ADR-008).
            pattern: \S
        additionalProperties: false
    Review:
      type: object
      required:
      - reviewId
      - analysisId
      - version
      - isApproved
      - doctorId
      - createdAt
      - aiResultVersion
      properties:
        reviewId:
          type: string
          format: uuid
        analysisId:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
        isApproved:
          type: boolean
        correctedRiskLevel:
          $ref: '#/components/schemas/RiskLevel'
        doctorNotes:
          type: string
        doctorId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        reason:
          type: string
          pattern: \S
        aiResultVersion:
          type: integer
          description: Phiên bản kết quả AI gốc được review; bản gốc không bị ghi
            đè
          minimum: 1
      description: Append-only, version tăng theo analysisId; tham chiếu AnalysisResult
        đúng ảnh. Không ghi đè AI. aiResultVersion không phải review version.
      additionalProperties: false
    Error:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          - correlationId
          - retryable
          properties:
            code:
              type: string
              description: 'Mã lỗi ERR_*. Ánh xạ tên trong State Machine (SCRUM-52):
                VALIDATION_ERROR=ERR_VALIDATION, UNAUTHORIZED=ERR_UNAUTHORIZED, FORBIDDEN=ERR_FORBIDDEN,
                NOT_FOUND=ERR_NOT_FOUND, IDEMPOTENCY_KEY_REUSED=ERR_IDEMPOTENCY_KEY_REUSED,
                REVIEW_VERSION_CONFLICT=ERR_CONCURRENT_REVIEW, INVALID_STATE=ERR_INVALID_STATE,
                TOO_MANY_REQUESTS=ERR_TOO_MANY_REQUESTS. Lỗi ở lớp xử lý AI: ERR_AI_FAILED,
                ERR_TIMEOUT, ERR_NETWORK, ERR_IMAGE_LOW_QUALITY, ERR_IMAGE_MISSING,
                ERR_INSUFFICIENT_CREDIT, ERR_DUPLICATE_REQUEST.'
            message:
              type: string
            details:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  issue:
                    type: string
            correlationId:
              type: string
            retryable:
              type: boolean
      additionalProperties: false
    Metrics:
      type: object
      properties:
        vesselDensity:
          type: number
          nullable: true
        tortuosityIndex:
          type: number
          nullable: true
        avRatio:
          type: number
          nullable: true
        fractalDimension:
          type: number
          nullable: true
        branchingPoints:
          type: integer
          nullable: true
      required:
      - vesselDensity
      - tortuosityIndex
      - avRatio
      - fractalDimension
      - branchingPoints
      additionalProperties: false
    ReviewStatus:
      type: string
      enum:
      - NOT_REQUIRED
      - PENDING
      - IN_REVIEW
      - REVIEWED
      - CORRECTION_REQUIRED
      description: Runtime v0.6 dùng NOT_REQUIRED → PENDING → REVIEWED. IN_REVIEW/CORRECTION_REQUIRED
        là dự phòng, chưa có operation; backend/fixtures không tự sinh. COMPLETED
        đưa về PENDING, review thành công đưa REVIEWED.
    BatchItem:
      type: object
      required:
      - analysisId
      - processingStatus
      properties:
        analysisId:
          type: string
          format: uuid
        existingAnalysisId:
          type: string
          format: uuid
          description: Có khi processingStatus là DUPLICATE; ID phân tích gốc trong
            phạm vi dedupe đã được kiểm quyền. Không tự cấp quyền đọc resource được
            tham chiếu.
        fileName:
          type: string
        processingStatus:
          $ref: '#/components/schemas/ProcessingStatus'
        reviewStatus:
          $ref: '#/components/schemas/ReviewStatus'
        riskLevel:
          type: string
          nullable: true
          enum:
          - LOW
          - MODERATE
          - HIGH
          - null
        error:
          $ref: '#/components/schemas/ErrorInfo'
        job:
          $ref: '#/components/schemas/Job'
        riskAvailable:
          type: boolean
      additionalProperties: false
    Batch:
      type: object
      required:
      - batchId
      - items
      - createdAt
      - batchStatus
      - summary
      properties:
        batchId:
          type: string
          format: uuid
        items:
          type: array
          items:
            $ref: '#/components/schemas/BatchItem'
        createdAt:
          type: string
          format: date-time
        batchStatus:
          type: string
          enum:
          - IN_PROGRESS
          - COMPLETED
          - PARTIAL_FAILED
          - FAILED
          description: 'IN_PROGRESS nếu còn PENDING/QUEUED/PROCESSING/RETRY_READY
            hoặc FAILED còn retry. Khi tất cả terminal: COMPLETED nếu không có FAILED/LOW_QUALITY/REJECTED;
            PARTIAL_FAILED nếu có lỗi và có COMPLETED hoặc DUPLICATE; FAILED nếu mọi
            item đều lỗi. DUPLICATE là item đã được bỏ qua hợp lệ, không có nghĩa
            tạo kết quả AI mới. Summary/items chỉ gồm tài nguyên được phép thấy.'
        summary:
          $ref: '#/components/schemas/BatchSummary'
      additionalProperties: false
    ErrorInfo:
      type: object
      required:
      - code
      - message
      - retryable
      properties:
        code:
          type: string
          enum:
          - ERR_AI_FAILED
          - ERR_TIMEOUT
          - ERR_NETWORK
          - ERR_IMAGE_LOW_QUALITY
          - ERR_IMAGE_MISSING
          - ERR_INSUFFICIENT_CREDIT
          - ERR_UNAUTHORIZED
          - ERR_DUPLICATE_REQUEST
          - ERR_VALIDATION
          - ERR_UNSUPPORTED_MODALITY
          - ERR_CONCURRENT_REVIEW
          - ERR_IDEMPOTENCY_KEY_REUSED
          - ERR_AI_OUTPUT_INVALID
        message:
          type: string
        retryable:
          type: boolean
        retryCount:
          type: integer
          description: Số retry đã thực hiện, suy ra attemptNo - 1; không phải cột
            Job.retry_count.
          minimum: 0
      description: Lý do khi processingStatus là FAILED, LOW_QUALITY, REJECTED hoặc
        DUPLICATE.
      additionalProperties: false
    FileRef:
      type: object
      required:
      - fileId
      - kind
      properties:
        fileId:
          type: string
          format: uuid
        kind:
          type: string
          enum:
          - original
          - mask
          - overlay
          - heatmap
          - annotated
      description: Tham chiếu tệp riêng tư; không chứa URL hay object key.
      additionalProperties: false
    FileAccess:
      type: object
      required:
      - url
      - expiresAt
      properties:
        url:
          type: string
          description: URL ký, hết hạn ngắn
        expiresAt:
          type: string
          format: date-time
      additionalProperties: false
    Job:
      type: object
      required:
      - jobId
      - status
      - retryCount
      - attemptNo
      properties:
        jobId:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - QUEUED
          - RUNNING
          - SUCCEEDED
          - FAILED
          - RETRY_READY
          - DEAD_LETTER
        retryCount:
          type: integer
          minimum: 0
        attemptNo:
          type: integer
          minimum: 1
      description: Job hiện hành/gần nhất của ảnh. Một Job = một attempt; retry tạo
        jobId mới. retryCount = attemptNo - 1.
      additionalProperties: false
    Warning:
      type: object
      additionalProperties: false
      required:
      - code
      - message
      properties:
        code:
          type: string
          minLength: 1
        message:
          type: string
          minLength: 1
    BatchSummary:
      type: object
      additionalProperties: false
      required:
      - total
      - active
      - succeeded
      - failed
      - duplicate
      - byStatus
      properties:
        total:
          type: integer
          minimum: 0
        active:
          type: integer
          minimum: 0
        succeeded:
          type: integer
          minimum: 0
        failed:
          type: integer
          minimum: 0
        duplicate:
          type: integer
          minimum: 0
        byStatus:
          type: object
          additionalProperties: false
          required: *id001
          properties:
            PENDING:
              type: integer
              minimum: 0
            QUEUED:
              type: integer
              minimum: 0
            PROCESSING:
              type: integer
              minimum: 0
            COMPLETED:
              type: integer
              minimum: 0
            FAILED:
              type: integer
              minimum: 0
            RETRY_READY:
              type: integer
              minimum: 0
            LOW_QUALITY:
              type: integer
              minimum: 0
            REJECTED:
              type: integer
              minimum: 0
            DUPLICATE:
              type: integer
              minimum: 0
      description: total=active+succeeded+failed+duplicate=sum(byStatus). succeeded=COMPLETED;
        duplicate=DUPLICATE; active gồm trạng thái đang chạy/chờ và FAILED retryable
        còn được retry; failed chỉ lỗi kết thúc FAILED/LOW_QUALITY/REJECTED. byStatus
        đếm trạng thái thô. Backend kiểm tra các invariant, JSON Schema không biểu
        diễn phép cộng.
  responses:
    ValidationError:
      description: Dữ liệu không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Thiếu hoặc sai token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Vai trò không được phép dùng chức năng này
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: 'Không tồn tại, khác tenant, không phải của mình hoặc không được
        phân công (cùng một phản hồi, không phân biệt). Với tạo yêu cầu: patientId
        ngoài phạm vi.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Xung đột trạng thái / idempotency / phiên bản review
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InsufficientCredit:
      description: Không đủ credit (tính từ DB, không từ cache - BR-09)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PayloadTooLarge:
      description: Ảnh quá lớn
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnsupportedMedia:
      description: Định dạng ảnh không hỗ trợ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: Vượt giới hạn tần suất
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 0
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
