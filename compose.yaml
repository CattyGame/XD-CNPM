services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - aura_network
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - aura_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management-alpine
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Set RABBITMQ_USER in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - aura_network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  analysis-api:
    build:
      context: .
      dockerfile: src/services/AURA.Analysis.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
    ports:
      - "127.0.0.1:5001:8080"
    networks:
      - aura_network
    restart: unless-stopped

  api-gateway:
    build:
      context: .
      dockerfile: src/gateway/AURA.ApiGateway/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      ReverseProxy__Clusters__analysis-cluster__Destinations__analysis-api__Address: "http://analysis-api:8080/"
      ReverseProxy__Clusters__billing-cluster__Destinations__billing-api__Address: "http://billing-api:8080/"
    ports:
      - "127.0.0.1:5000:8080"
    depends_on:
      - analysis-api
    networks:
      - aura_network
    restart: unless-stopped

  ai-core:
    build:
      context: src/ai-core
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - aura_network
    restart: unless-stopped

  billing-api:
    build:
      context: .
      dockerfile: src/services/AURA.Billing.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__Postgres: >-
        Host=postgres;Port=5432;Database=${POSTGRES_DB};
        Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};
        Timeout=5;Command Timeout=5
      ConnectionStrings__Redis: "redis:6379"
      Cache__PackageCatalogKey: "aura:local:billing:poc:packages:v1"
      Cache__PackageCatalogTtlSeconds: "60"
    ports:
      - "127.0.0.1:5002:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - aura_network
    restart: unless-stopped

networks:
  aura_network:
    name: ${AURA_DOCKER_NETWORK:-aura_network}
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
