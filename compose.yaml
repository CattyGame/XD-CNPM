services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - aura_network
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - aura_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management-alpine
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Set RABBITMQ_USER in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - aura_network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.33.0
    command:
      - azurite-blob
      - --blobHost
      - 0.0.0.0
      - --blobPort
      - "10000"
      - --location
      - /data
      - --disableProductStyleUrl
    ports:
      - "127.0.0.1:10000:10000"
    volumes:
      - azurite_data:/data
    networks:
      - aura_network
    restart: unless-stopped

  analysis-api:
    build:
      context: .
      dockerfile: src/services/AURA.Analysis.Api/Dockerfile
    env_file:
      - ./infra/storage/storage.docker.env.example
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__Postgres: >-
        Host=postgres;Port=5432;Database=${POSTGRES_DB};
        Username=aura_analysis_app;
        Password="${ANALYSIS_DB_PASSWORD:?Set ANALYSIS_DB_PASSWORD}";
        Timeout=5;Command Timeout=10
    ports:
      - "127.0.0.1:5001:8080"
    networks:
      - aura_network
    restart: unless-stopped
  api-gateway:
    build:
      context: .
      dockerfile: src/gateway/AURA.ApiGateway/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      ReverseProxy__Clusters__identity-cluster__Destinations__identity-api__Address: "http://identity-api:8080/"
      ReverseProxy__Clusters__profile-cluster__Destinations__profile-api__Address: "http://profile-api:8080/"
      ReverseProxy__Clusters__analysis-cluster__Destinations__analysis-api__Address: "http://analysis-api:8080/"
      ReverseProxy__Clusters__billing-cluster__Destinations__billing-api__Address: "http://billing-api:8080/"
    ports:
      - "127.0.0.1:5000:8080"
    depends_on:
      - analysis-api
    networks:
      - aura_network
    restart: unless-stopped

  ai-core:
    build:
      context: src/ai-core
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - aura_network
    restart: unless-stopped

  billing-api:
    build:
      context: .
      dockerfile: src/services/AURA.Billing.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      Billing__Environment: "TEST"
      Billing__IsMock: "false"
      ConnectionStrings__Postgres: >-
        Host=postgres;Port=5432;Database=${POSTGRES_DB};
        Username=aura_billing_app;
        Password="${BILLING_DB_PASSWORD:?Set BILLING_DB_PASSWORD}";
        Timeout=5;Command Timeout=5
      ConnectionStrings__Redis: "redis:6379"
      Cache__PackageCatalogKey: "aura:local:billing:poc:packages:v1"
      Cache__PackageCatalogTtlSeconds: "60"
      Services__Identity__BaseUrl: "http://identity-api:8080"
      Services__Profile__BaseUrl: "http://profile-api:8080"
      ServiceAuth__Issuer: "aura-identity-local"
      ServiceAuth__Audience: "aura-billing"
      ServiceAuth__ClientId: "billing-api"
      ServiceAuth__ClientSecret: "${BILLING_SERVICE_CLIENT_SECRET:?Set BILLING_SERVICE_CLIENT_SECRET}"
    ports:
      - "127.0.0.1:5002:8080"
    depends_on:
      postgres:
        condition: service_healthy
      identity-api:
        condition: service_started
      profile-api:
        condition: service_started
    networks:
      - aura_network
    restart: unless-stopped

  identity-api:
    build:
      context: .
      dockerfile: src/services/AURA.Identity.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__Postgres: >-
        Host=postgres;Port=5432;Database=${POSTGRES_DB};
        Username=aura_identity_app;
        Password="${IDENTITY_DB_PASSWORD:?Set IDENTITY_DB_PASSWORD}";
        Timeout=5;Command Timeout=10
      Services__Profile__BaseUrl: "http://profile-api:8080"
      ServiceAuth__Issuer: "aura-identity-local"
      ServiceAuth__ClientSecret: "${IDENTITY_SERVICE_CLIENT_SECRET:?Set IDENTITY_SERVICE_CLIENT_SECRET}"
      ServiceAuth__TokenLifetimeSeconds: "300"
      ServiceAuth__RegistryPath: "/run/aura-service-auth/issuer/identity-clients.json"
      ServiceAuth__PrivateKeyPath: "/run/aura-service-auth/issuer/signing-key.pem"
    volumes:
      - type: bind
        source: "${AURA_SERVICE_AUTH_HOME:?Set AURA_SERVICE_AUTH_HOME}/issuer"
        target: /run/aura-service-auth/issuer
        read_only: true
      - type: bind
        source: "${AURA_SERVICE_AUTH_HOME:?Set AURA_SERVICE_AUTH_HOME}/public"
        target: /run/aura-service-auth/public
        read_only: true
    ports:
      - "127.0.0.1:5004:8080"
    depends_on:
      postgres:
        condition: service_healthy
      profile-api:
        condition: service_started
    networks:
      - aura_network
    restart: unless-stopped

  profile-api:
    build:
      context: .
      dockerfile: src/services/AURA.Profile.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__Postgres: >-
        Host=postgres;Port=5432;Database=${POSTGRES_DB};
        Username=aura_profile_app;
        Password="${PROFILE_DB_PASSWORD:?Set PROFILE_DB_PASSWORD}";
        Timeout=5;Command Timeout=10
      Services__Identity__BaseUrl: "http://identity-api:8080"
      ServiceAuth__Issuer: "aura-identity-local"
      ServiceAuth__Audience: "aura-profile"
      ServiceAuth__PublicKeyPath: "/run/aura-service-auth/public/signing-public.pem"
      ServiceAuth__ClientId: "profile-api"
      ServiceAuth__ClientSecret: "${PROFILE_SERVICE_CLIENT_SECRET:?Set PROFILE_SERVICE_CLIENT_SECRET}"
    volumes:
      - type: bind
        source: "${AURA_SERVICE_AUTH_HOME:?Set AURA_SERVICE_AUTH_HOME}/public"
        target: /run/aura-service-auth/public
        read_only: true
    ports:
      - "127.0.0.1:5005:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - aura_network
    restart: unless-stopped

networks:
  aura_network:
    name: ${AURA_DOCKER_NETWORK:-aura_network}
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  azurite_data:
    external: true
    name: aura_azurite_data
