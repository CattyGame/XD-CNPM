# AURA Analysis Worker Scaling Template (Sprint 4-5)
# Supports scaling 2 to 4 worker replicas with RabbitMQ Quorum Queues

services:
  analysis-worker:
    build:
      context: .
      dockerfile: src/services/Aura.Worker.Analysis/Dockerfile
    environment:
      DOTNET_ENVIRONMENT: Production
      RabbitMq__HostName: rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__VirtualHost: /aura-s3
      RabbitMq__UserName: s3-worker
      RabbitMq__Password: ${RABBITMQ_WORKER_PASSWORD:?Set RABBITMQ_WORKER_PASSWORD in .env}
      WorkerOptions__Prefetch: 10
      ConnectionStrings__Redis: redis:6379
    deploy:
      mode: replicated
      replicas: 4
      resources:
        limits:
          cpus: '1.5'
          memory: 1024M
        reservations:
          cpus: '0.25'
          memory: 256M
    networks:
      - aura_network
    restart: on-failure

networks:
  aura_network:
    name: aura_network
    external: true
