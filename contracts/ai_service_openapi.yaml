openapi: 3.0.3

info:
  title: AURA AI Analysis Service API
  description: >
    AI API nội bộ của AURA. Runtime hiện là Mock Service phục vụ
    kiểm thử giao tiếp; chưa tích hợp thuật toán phân vùng thật.
    WARNING có kết quả hợp lệ không tự đồng nghĩa LOW_QUALITY.
    API_VERSION không phải phiên bản public Analysis contract.
  version: 1.1.0
  contact:
    name: Dao Duy Quan (M4 Lead)
    email: quandd2937@ut.edu.vn

servers:
  - url: http://localhost:8000
    description: Local development
  - url: http://ai-core:8000
    description: Internal Docker network

tags:
  - name: Health
    description: Kiểm tra tình trạng service
  - name: Platform
    description: Kiểm tra kết nối
  - name: Analysis
    description: Phân tích ảnh giả lập phục vụ kiểm thử

paths:
  /health:
    get:
      tags: [Health]
      summary: Kiểm tra trạng thái AI Service
      operationId: checkHealth
      responses:
        '200':
          description: Service đang hoạt động
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: ok
                version: 0.1.0
                service: AURA.AiCore
                device: cpu
                model_loaded: false
                uptime_seconds: 124.8

  /api/v1/platform/ping:
    get:
      tags: [Platform]
      summary: Kiểm tra kết nối AI Core
      operationId: pingService
      responses:
        '200':
          description: Kết nối hoạt động
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PingResponse'
              example:
                service: AURA.AiCore
                message: AI Core template is running
                timestamp: '2026-10-10T03:00:00Z'

  /api/v1/analyze:
    post:
      tags: [Analysis]
      summary: Nhận ảnh Base64 và trả kết quả mock
      description: |
        Endpoint nội bộ dành cho Analysis Worker.

        Runtime chưa tích hợp Frangi hoặc U-Net. Các chỉ số,
        mask và overlay là dữ liệu giả lập.

        Cấu hình kiểm thử phía server:
        - AURA_MOCK_SCENARIO=SUCCESS: mặc định.
        - AURA_MOCK_SCENARIO=WARNING và
          AURA_MOCK_SCENARIOS_ENABLED=true: trả WARNING với kết quả đầy đủ.
        - Scenario không hợp lệ hoặc chưa được bật: trả lỗi 500.

        Không chọn scenario bằng request_id hoặc tham số client.
        WARNING không tự đồng nghĩa LOW_QUALITY.

        Example dùng PNG RGB tổng hợp 64x48, không phải ảnh đáy mắt.
        processing_time_ms trong example chỉ minh họa cấu trúc.
      operationId: analyzeRetinaBase64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalysisRequest'
            example:
              request_id: demo-ai-001
              patient_id: null
              eye_side: unknown
              mode: retina_vessels
              modality: FUNDUS
              image_base64: "iVBORw0KGgoAAAANSUhEUgAAAEAAAAAwCAIAAAAuKetIAAAAZUlEQVR4nO3PUQkAIBTAwBfCEMaxfxpD+HEIgwW4zdnr64YLGtCCBrSgAS1oQAsa0IIGtKABLWhACxrQgga0oAEtaEALGtCCBrSgAS1oQAsa0IIGtKABLWhACxrQgga0oAEteOwCadmQWyWfhSMAAAAASUVORK5CYII="
              include_mask: false
              include_overlay: false
      responses:
        '200':
          description: >
            SUCCESS hoặc WARNING với kết quả giả lập hợp lệ.
            WARNING vẫn giữ metrics và risk_assessment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisResponse'
              examples:
                success:
                  summary: Kết quả mock thành công
                  value:
                    request_id: demo-ai-001
                    patient_id: null
                    timestamp: '2026-10-10T03:00:00Z'
                    status: SUCCESS
                    warnings: []
                    is_mock: true
                    model_version: mock-v0.1
                    threshold_version: v0.1
                    config_version: v0.1
                    limitations: Kết quả giả lập, chưa tích hợp phân vùng thật.
                    processing_time_ms: 10.0
                    image_info:
                      width: 64
                      height: 48
                      channels: 3
                      eye_side: unknown
                      modality: FUNDUS
                    metrics:
                      vessel_density: 0.1485
                      tortuosity_index: 1.165
                      av_ratio: 0.672
                      fractal_dimension: 1.475
                      branching_points: 62
                    risk_assessment:
                      risk_score: 0.32
                      risk_level: LOW
                      confidence_score: 0.91
                      indicators:
                        - '[MOCK] Chỉ số cố định phục vụ kiểm thử.'
                      disclaimer: Kết quả giả lập, không phải chẩn đoán.
                    segmentation: null

                warning:
                  summary: Cảnh báo nhưng vẫn có kết quả mock
                  value:
                    request_id: demo-ai-001
                    patient_id: null
                    timestamp: '2026-10-10T03:00:00Z'
                    status: WARNING
                    warnings:
                      - code: AI_WARNING
                        message: '[MOCK] Cảnh báo kỹ thuật, không xác nhận ảnh kém chất lượng.'
                    is_mock: true
                    model_version: mock-v0.1
                    threshold_version: v0.1
                    config_version: v0.1
                    limitations: Kết quả giả lập, chưa tích hợp phân vùng thật.
                    processing_time_ms: 10.0
                    image_info:
                      width: 64
                      height: 48
                      channels: 3
                      eye_side: unknown
                      modality: FUNDUS
                    metrics:
                      vessel_density: 0.1485
                      tortuosity_index: 1.165
                      av_ratio: 0.672
                      fractal_dimension: 1.475
                      branching_points: 62
                    risk_assessment:
                      risk_score: 0.32
                      risk_level: LOW
                      confidence_score: 0.91
                      indicators:
                        - '[MOCK] Chỉ số cố định phục vụ kiểm thử.'
                      disclaimer: Kết quả giả lập, không phải chẩn đoán.
                    segmentation: null

        '400':
          description: Base64 sai, ảnh hỏng hoặc vượt giới hạn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error_code: INVALID_IMAGE_PAYLOAD
                message: Dữ liệu ảnh không hợp lệ.
                details:
                  supported_formats: [PNG, JPEG, WEBP]
                timestamp: '2026-10-10T03:00:00Z'

        '422':
          description: Sai schema hoặc modality/mode không được hỗ trợ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unsupportedModality:
                  value:
                    error_code: UNSUPPORTED_MODALITY
                    message: OCT chưa được hỗ trợ; chỉ chấp nhận FUNDUS.
                    details:
                      supported_modalities: [FUNDUS]
                      received_modality: OCT
                    timestamp: '2026-10-10T03:00:00Z'
                unsupportedMode:
                  value:
                    error_code: UNSUPPORTED_MODE
                    message: Chỉ hỗ trợ retina_vessels.
                    details:
                      supported_modes: [retina_vessels]
                    timestamp: '2026-10-10T03:00:00Z'
                invalidModality:
                  value:
                    error_code: INVALID_MODALITY
                    message: Modality không hợp lệ.
                    details:
                      supported_modalities: [FUNDUS]
                    timestamp: '2026-10-10T03:00:00Z'
                schemaValidation:
                  value:
                    error_code: SCHEMA_VALIDATION_ERROR
                    message: Sai định dạng hoặc thiếu trường bắt buộc.
                    details:
                      errors: []
                    timestamp: '2026-10-10T03:00:00Z'

        '500':
          description: Lỗi nội bộ hoặc cấu hình mock không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error_code: INFERENCE_RUNTIME_ERROR
                message: Lỗi nội bộ khi xử lý AI.
                details: null
                timestamp: '2026-10-10T03:00:00Z'

components:
  schemas:
    HealthResponse:
      type: object
      required:
        - status
        - version
        - service
        - device
        - model_loaded
        - uptime_seconds
      properties:
        status:
          type: string
          example: ok
        version:
          type: string
          example: 0.1.0
        service:
          type: string
          example: AURA.AiCore
        device:
          type: string
          example: cpu
        model_loaded:
          type: boolean
          example: false
        uptime_seconds:
          type: number
          example: 124.8

    PingResponse:
      type: object
      required: [service, message, timestamp]
      properties:
        service:
          type: string
        message:
          type: string
        timestamp:
          type: string
          format: date-time

    EyeSide:
      type: string
      enum: [left, right, unknown]
      default: unknown

    AnalysisMode:
      type: string
      enum: [retina_vessels]
      default: retina_vessels

    RiskLevel:
      type: string
      enum: [LOW, MODERATE, HIGH]

    AnalysisStatus:
      type: string
      enum: [SUCCESS, WARNING, FAILED]
      default: SUCCESS
      description: >
        Runtime mock hiện trả SUCCESS hoặc WARNING cho HTTP 200.
        Lỗi xử lý hiện được trả bằng ErrorResponse với HTTP 4xx/5xx.

    AnalysisRequest:
      type: object
      required: [request_id, image_base64]
      properties:
        request_id:
          type: string
          description: ID yêu cầu do bên gọi cung cấp; không dùng chọn mock scenario.
        patient_id:
          type: string
          nullable: true
          default: null
        eye_side:
          $ref: '#/components/schemas/EyeSide'
        mode:
          $ref: '#/components/schemas/AnalysisMode'
        modality:
          type: string
          default: FUNDUS
          description: FUNDUS; OCT bị từ chối với HTTP 422.
        image_base64:
          type: string
          description: >
            Ảnh PNG/JPEG/WEBP hợp lệ của AI nội bộ.
            Giới hạn dữ liệu giải mã 10 MiB và 16 triệu pixel.
            Không tự mở rộng định dạng public Analysis API.
        include_mask:
          type: boolean
          default: true
        include_overlay:
          type: boolean
          default: true

    ImageInfo:
      type: object
      required: [width, height]
      properties:
        width:
          type: integer
        height:
          type: integer
        channels:
          type: integer
          default: 3
        eye_side:
          $ref: '#/components/schemas/EyeSide'
        modality:
          type: string
          default: FUNDUS

    VesselMetrics:
      type: object
      required:
        - vessel_density
        - tortuosity_index
        - av_ratio
        - fractal_dimension
        - branching_points
      description: Các giá trị hiện là hằng số mock, không phải đo từ ảnh.
      properties:
        vessel_density:
          type: number
          example: 0.1485
        tortuosity_index:
          type: number
          example: 1.165
        av_ratio:
          type: number
          example: 0.672
        fractal_dimension:
          type: number
          example: 1.475
        branching_points:
          type: integer
          example: 62

    RiskAssessment:
      type: object
      required:
        - risk_score
        - risk_level
        - confidence_score
        - indicators
      description: Phân tầng giả lập phục vụ kiểm thử, chưa có giá trị lâm sàng.
      properties:
        risk_score:
          type: number
          example: 0.32
        risk_level:
          $ref: '#/components/schemas/RiskLevel'
        confidence_score:
          type: number
          example: 0.91
        indicators:
          type: array
          items:
            type: string
        disclaimer:
          type: string
          description: Runtime luôn trả cảnh báo không thay thế chẩn đoán.

    SegmentationResult:
      type: object
      properties:
        mask_format:
          type: string
          default: png_base64
        mask_base64:
          type: string
          nullable: true
          default: null
          description: PNG mock mode L, pixel 0/255, cùng kích thước ảnh đầu vào.
        overlay_base64:
          type: string
          nullable: true
          default: null
          description: PNG mock RGB cùng kích thước; không phủ trên ảnh gốc.

    AnalysisWarning:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          minLength: 1
          example: AI_WARNING
        message:
          type: string
          minLength: 1
          description: Không tự đồng nghĩa LOW_QUALITY.

    AnalysisResponse:
      type: object
      required:
        - request_id
        - timestamp
        - processing_time_ms
        - image_info
        - metrics
        - risk_assessment
      properties:
        request_id:
          type: string
        patient_id:
          type: string
          nullable: true
          default: null
        timestamp:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/AnalysisStatus'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/AnalysisWarning'
          description: Danh sách cảnh báo của kết quả hợp lệ; mặc định rỗng.
        is_mock:
          type: boolean
          default: true
        model_version:
          type: string
          default: mock-v0.1
        threshold_version:
          type: string
          default: v0.1
        config_version:
          type: string
          default: v0.1
        limitations:
          type: string
          description: Giới hạn kỹ thuật của kết quả mock.
        processing_time_ms:
          type: number
          description: Thời gian xử lý runtime, không phải latency toàn hệ thống.
        image_info:
          $ref: '#/components/schemas/ImageInfo'
        metrics:
          $ref: '#/components/schemas/VesselMetrics'
        risk_assessment:
          $ref: '#/components/schemas/RiskAssessment'
        segmentation:
          allOf:
            - $ref: '#/components/schemas/SegmentationResult'
          nullable: true

    ErrorResponse:
      type: object
      required: [error_code, message, timestamp]
      properties:
        error_code:
          type: string
        message:
          type: string
        details:
          type: object
          nullable: true
          additionalProperties: true
        timestamp:
          type: string
          format: date-time