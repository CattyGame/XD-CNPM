openapi: 3.0.3

info:
  title: AURA AI Analysis Service API
  description: >
    AI API nội bộ của AURA (Sprint 3 Contract 1.2.0). Runtime mặc định chạy
    thuật toán phân vùng mạch máu võng mạc Frangi v0.2 thật theo cấu hình cố định
    trong config/ai-frangi.yaml và xác thực RS256 Service JWT fail-closed.
    Phân vùng Frangi chưa cung cấp đánh giá rủi ro lâm sàng (risk_available=false,
    risk_assessment=null, status=WARNING kèm RISK_UNAVAILABLE).
    WARNING có kết quả hợp lệ không tự đồng nghĩa LOW_QUALITY.
  version: 1.2.0
  contact:
    name: Dao Duy Quan (M4 Lead)
    email: quandd2937@ut.edu.vn

servers:
  - url: http://ai-core:8000
    description: Internal Docker network (Sprint 3 canonical)
  - url: http://localhost:8000
    description: Local development

tags:
  - name: Health
    description: Kiểm tra liveness (/health) và readiness (/ready) của AI Service
  - name: Platform
    description: Kiểm tra kết nối nền tảng
  - name: Analysis
    description: Phân vùng mạch máu võng mạc FUNDUS thực tế bằng Frangi v0.2

paths:
  /health:
    get:
      tags: [Health]
      summary: Kiểm tra liveness AI Service
      operationId: checkHealth
      responses:
        '200':
          description: Liveness only
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: ok
                version: 0.1.0
                service: AURA.AiCore
                device: cpu
                model_loaded: false
                uptime_seconds: 124.8

  /ready:
    get:
      tags: [Health]
      summary: Kiểm tra readiness (cấu hình Frangi thật và khóa công khai JWT RS256 đã sẵn sàng)
      operationId: checkReady
      responses:
        '200':
          description: Real Frangi configuration and signing keys loaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
              example:
                status: ready
                service: AURA.AiCore
                version: 0.2.0
                api_version: 1.2.0
                engine: frangi
                model_version: frangi-v0.2
                config_version: s3-frangi-1.0.0
                threshold_version: frangi-threshold-0.02-v1
                jwt_verification_ready: true
                timestamp: '2026-10-28T02:00:00Z'
        '503':
          description: Not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error_code: SERVICE_NOT_READY
                message: Khóa công khai kiểm chữ ký JWT dịch vụ chưa được cấu hình.
                details: null
                timestamp: '2026-10-28T02:00:00Z'

  /api/v1/platform/ping:
    get:
      tags: [Platform]
      summary: Kiểm tra kết nối AI Core
      operationId: pingService
      responses:
        '200':
          description: Kết nối hoạt động
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PingResponse'
              example:
                service: AURA.AiCore
                message: AI Core template is running
                timestamp: '2026-10-28T02:00:00Z'

  /api/v1/analyze:
    post:
      tags: [Analysis]
      summary: Nhận ảnh FUNDUS Base64 và thực thi phân vùng mạch máu Frangi v0.2 thật
      description: |
        Endpoint nội bộ dành cho Analysis Worker (Sprint 3 Contract 1.2.0).

        - Yêu cầu xác thực RS256 Service JWT (`iss=aura-identity-s3-v1`, `aud=aura-ai`, `scope=ai:analyze`, `client_id=analysis-worker`).
        - Nhận ảnh PNG hoặc JPEG dưới dạng Base64 trần (không nhận data URL), giới hạn 10 MiB và 16.000.000 pixel.
        - Giữ nguyên kích thước ảnh gốc (width, height), không crop/resize 512.
        - Kiểm tra chất lượng ảnh trước khi chạy Frangi theo công thức trong `config/ai-frangi.yaml`; từ chối bằng HTTP 422 `LOW_QUALITY_IMAGE` nếu không đạt.
        - Trả về `status=WARNING` kèm `RISK_UNAVAILABLE`, `is_mock=false`, `risk_available=false`, `risk_assessment=null`, cùng PNG mask (`L`, `0/255`) và PNG overlay (`RGB`).
      operationId: analyzeRetina
      security:
        - serviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalysisRequest'
            example:
              request_id: 58685092-7782-5bb6-b147-1b73c6047edd
              patient_id: null
              eye_side: left
              mode: retina_vessels
              modality: FUNDUS
              image_base64: iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+jZfoAAAAASUVORK5CYII=
              include_mask: true
              include_overlay: true
      responses:
        '200':
          description: Valid SUCCESS or WARNING
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisResponse'
              examples:
                frangiWarning:
                  summary: Kết quả phân vùng Frangi v0.2 thật (Sprint 3)
                  value:
                    request_id: 58685092-7782-5bb6-b147-1b73c6047edd
                    patient_id: null
                    timestamp: '2026-10-28T02:00:00Z'
                    status: WARNING
                    warnings:
                      - code: RISK_UNAVAILABLE
                        message: Frangi provides vessel segmentation only; clinical risk assessment is not available.
                    is_mock: false
                    model_version: frangi-v0.2
                    config_version: s3-frangi-1.0.0
                    threshold_version: frangi-threshold-0.02-v1
                    limitations: Segmentation research baseline; no clinical risk assessment.
                    processing_time_ms: 100.0
                    image_info:
                      width: 999
                      height: 960
                      channels: 3
                      eye_side: left
                      modality: FUNDUS
                    metrics:
                      vessel_density: 0.0842
                      tortuosity_index: null
                      av_ratio: null
                      fractal_dimension: null
                      branching_points: null
                    risk_available: false
                    risk_assessment: null
                    segmentation:
                      mask_format: png_base64
                      mask_base64: iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+jZfoAAAAASUVORK5CYII=
                      overlay_base64: iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+jZfoAAAAASUVORK5CYII=

        '400':
          description: Invalid Base64/image payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error_code: INVALID_IMAGE_PAYLOAD
                message: Dữ liệu ảnh không hợp lệ.
                details:
                  supported_formats: [PNG, JPEG]
                timestamp: '2026-10-28T02:00:00Z'

        '401':
          description: Invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error_code: INVALID_BEARER_TOKEN
                message: Chữ ký JWT dịch vụ không hợp lệ hoặc token đã hết hạn.
                details: null
                timestamp: '2026-10-28T02:00:00Z'

        '403':
          description: Wrong audience/scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error_code: INSUFFICIENT_TOKEN_SCOPE
                message: Token dịch vụ thiếu quyền 'ai:analyze'.
                details: null
                timestamp: '2026-10-28T02:00:00Z'

        '422':
          description: LOW_QUALITY_IMAGE or unsupported input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                lowQualityImage:
                  value:
                    error_code: LOW_QUALITY_IMAGE
                    message: Ảnh không đạt ngưỡng chất lượng kỹ thuật đầu vào.
                    details:
                      is_mock: false
                      quality_assessment_performed: true
                      failed_checks: [LOW_LUMINANCE]
                    timestamp: '2026-10-28T02:00:00Z'
                unsupportedModality:
                  value:
                    error_code: UNSUPPORTED_MODALITY
                    message: OCT chưa được hỗ trợ; chỉ chấp nhận FUNDUS.
                    details:
                      supported_modalities: [FUNDUS]
                      received_modality: OCT
                    timestamp: '2026-10-28T02:00:00Z'

        '500':
          description: Processing failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error_code: INFERENCE_RUNTIME_ERROR
                message: Lỗi nội bộ khi xử lý phân vùng mạch máu Frangi.
                details: null
                timestamp: '2026-10-28T02:00:00Z'

        '503':
          description: Not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error_code: SERVICE_NOT_READY
                message: Khóa công khai kiểm chữ ký JWT dịch vụ chưa được cấu hình.
                details: null
                timestamp: '2026-10-28T02:00:00Z'

components:
  securitySchemes:
    serviceBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    HealthResponse:
      type: object
      required:
        - status
        - version
        - service
        - device
        - model_loaded
        - uptime_seconds
      properties:
        status:
          type: string
          example: ok
        version:
          type: string
          example: 0.1.0
        service:
          type: string
          example: AURA.AiCore
        device:
          type: string
          example: cpu
        model_loaded:
          type: boolean
          example: false
        uptime_seconds:
          type: number
          example: 124.8

    ReadyResponse:
      type: object
      required:
        - status
        - service
        - version
        - api_version
        - engine
        - model_version
        - config_version
        - threshold_version
        - jwt_verification_ready
        - timestamp
      properties:
        status:
          type: string
          example: ready
        service:
          type: string
          example: AURA.AiCore
        version:
          type: string
          example: 0.2.0
        api_version:
          type: string
          example: 1.2.0
        engine:
          type: string
          example: frangi
        model_version:
          type: string
          example: frangi-v0.2
        config_version:
          type: string
          example: s3-frangi-1.0.0
        threshold_version:
          type: string
          example: frangi-threshold-0.02-v1
        jwt_verification_ready:
          type: boolean
          example: true
        timestamp:
          type: string
          format: date-time
          pattern: 'Z$'

    PingResponse:
      type: object
      required: [service, message, timestamp]
      properties:
        service:
          type: string
        message:
          type: string
        timestamp:
          type: string
          format: date-time
          pattern: 'Z$'

    EyeSide:
      type: string
      enum: [left, right, unknown]
      default: unknown

    AnalysisMode:
      type: string
      enum: [retina_vessels]
      default: retina_vessels

    RiskLevel:
      type: string
      enum: [LOW, MODERATE, HIGH]

    AnalysisStatus:
      type: string
      enum: [SUCCESS, WARNING, FAILED]
      default: WARNING

    AnalysisRequest:
      type: object
      additionalProperties: false
      required:
        - request_id
        - patient_id
        - eye_side
        - mode
        - modality
        - image_base64
        - include_mask
        - include_overlay
      properties:
        request_id:
          type: string
          format: uuid
          description: UUID của lượt phân tích (analysisId).
        patient_id:
          type: string
          nullable: true
          default: null
          description: Luôn là null trong contract AI nội bộ 1.2.
        eye_side:
          $ref: '#/components/schemas/EyeSide'
        mode:
          $ref: '#/components/schemas/AnalysisMode'
        modality:
          type: string
          enum: [FUNDUS]
          default: FUNDUS
        image_base64:
          type: string
          minLength: 4
          maxLength: 13981016
          description: Chuỗi Base64 trần của ảnh PNG/JPEG (tối đa 10 MiB và 16 triệu pixel).
        include_mask:
          type: boolean
          default: true
        include_overlay:
          type: boolean
          default: true

    ImageInfo:
      type: object
      additionalProperties: false
      required: [width, height, channels, eye_side, modality]
      properties:
        width:
          type: integer
          minimum: 1
        height:
          type: integer
          minimum: 1
        channels:
          type: integer
          enum: [3]
          default: 3
        eye_side:
          $ref: '#/components/schemas/EyeSide'
        modality:
          type: string
          enum: [FUNDUS]
          default: FUNDUS

    VesselMetrics:
      type: object
      additionalProperties: false
      required:
        - vessel_density
        - tortuosity_index
        - av_ratio
        - fractal_dimension
        - branching_points
      properties:
        vessel_density:
          type: number
          minimum: 0
          maximum: 1
          example: 0.0842
        tortuosity_index:
          type: number
          nullable: true
          default: null
        av_ratio:
          type: number
          nullable: true
          default: null
        fractal_dimension:
          type: number
          nullable: true
          default: null
        branching_points:
          type: integer
          nullable: true
          minimum: 0
          default: null

    RiskAssessment:
      type: object
      additionalProperties: false
      required:
        - risk_score
        - risk_level
        - confidence_score
        - indicators
        - disclaimer
      properties:
        risk_score:
          type: number
          minimum: 0
          maximum: 1
        risk_level:
          $ref: '#/components/schemas/RiskLevel'
        confidence_score:
          type: number
          minimum: 0
          maximum: 1
        indicators:
          type: array
          items:
            type: string
            minLength: 1
        disclaimer:
          type: string
          minLength: 1

    SegmentationResult:
      type: object
      additionalProperties: false
      required:
        - mask_format
        - mask_base64
        - overlay_base64
      properties:
        mask_format:
          type: string
          enum: [png_base64]
          default: png_base64
        mask_base64:
          type: string
          nullable: true
          minLength: 4
        overlay_base64:
          type: string
          nullable: true
          minLength: 4

    AnalysisWarning:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          minLength: 1
          example: RISK_UNAVAILABLE
        message:
          type: string
          minLength: 1

    AnalysisResponse:
      type: object
      additionalProperties: false
      required:
        - request_id
        - patient_id
        - timestamp
        - status
        - warnings
        - is_mock
        - model_version
        - config_version
        - threshold_version
        - limitations
        - processing_time_ms
        - image_info
        - metrics
        - risk_available
        - risk_assessment
        - segmentation
      properties:
        request_id:
          type: string
          format: uuid
        patient_id:
          type: string
          nullable: true
          default: null
        timestamp:
          type: string
          format: date-time
          pattern: 'Z$'
        status:
          $ref: '#/components/schemas/AnalysisStatus'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/AnalysisWarning'
        is_mock:
          type: boolean
          default: false
        model_version:
          type: string
          minLength: 1
          default: frangi-v0.2
        config_version:
          type: string
          minLength: 1
          default: s3-frangi-1.0.0
        threshold_version:
          type: string
          minLength: 1
          default: frangi-threshold-0.02-v1
        limitations:
          type: string
          minLength: 1
        processing_time_ms:
          type: number
          minimum: 0
        image_info:
          $ref: '#/components/schemas/ImageInfo'
        metrics:
          $ref: '#/components/schemas/VesselMetrics'
        risk_available:
          type: boolean
          default: false
        risk_assessment:
          allOf:
            - $ref: '#/components/schemas/RiskAssessment'
          nullable: true
          default: null
        segmentation:
          allOf:
            - $ref: '#/components/schemas/SegmentationResult'
          nullable: true

    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error_code, message, timestamp]
      properties:
        error_code:
          type: string
          minLength: 1
        message:
          type: string
          minLength: 1
        details:
          type: object
          nullable: true
          additionalProperties: true
        timestamp:
          type: string
          format: date-time
          pattern: 'Z$'
