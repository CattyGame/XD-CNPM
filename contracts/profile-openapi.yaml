        - name: clinicId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: patientId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/CorrelationIdHeader'
      responses:
        '200':
          description: Lấy thông tin bệnh nhân thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClinicPatientDto'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          description: Không tìm thấy bệnh nhân trong phòng khám.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

    patch:
      summary: Cập nhật thông tin bệnh nhân phòng khám
      description: Chỉnh sửa họ tên, ngày sinh, số điện thoại, mã BHYT hoặc cập nhật tiền sử bệnh án.
      operationId: updateClinicPatient
      tags:
        - Clinic Patients
      security:
        - BearerAuth: []
      parameters:
        - name: clinicId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: patientId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/CorrelationIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateClinicPatientRequest'
      responses:
        '200':
          description: Cập nhật thông tin thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClinicPatientDto'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          description: Không tìm thấy bệnh nhân.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/clinics/{clinicId}/assignments/batch:
    post:
      summary: Phân công theo nhóm bệnh nhân cho Bác sĩ
      description: Gán một danh sách nhiều bệnh nhân cho một Bác sĩ chuyên khoa phụ trách theo dõi.
      operationId: batchAssignDoctor
      tags:
        - Doctor Assignments
      security:
        - BearerAuth: []
      parameters:
        - name: clinicId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/CorrelationIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchAssignDoctorRequest'
      responses:
        '200':
          description: Phân công theo nhóm thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoctorAssignmentListResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'

  /api/v1/clinics/{clinicId}/assignments/{assignmentId}/transfer:
    post:
      summary: Chuyển giao ca bệnh cho Bác sĩ khác (Hội chẩn)
      description: Thu hồi phân công của Bác sĩ hiện tại và gán phân công cho Bác sĩ mới được chỉ định, lưu vết nguồn gốc chuyển giao.
      operationId: transferDoctorAssignment
      tags:
        - Doctor Assignments
      security:
        - BearerAuth: []
      parameters:
        - name: clinicId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: assignmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/CorrelationIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferDoctorAssignmentRequest'
      responses:
        '200':
          description: Chuyển giao phân công thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoctorAssignmentDto'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          description: Không tìm thấy phân công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/clinics/{clinicId}/assignments:
    post:
      summary: Phân công bác sĩ phụ trách bệnh nhân tại phòng khám
      description: |
        Chỉ cho phép CLINIC_ADMIN của phòng khám hoặc SYSTEM_ADMIN thực hiện.
        Bác sĩ phải là thành viên ACTIVE có vai trò DOCTOR tại phòng khám.
        Bệnh nhân phải thuộc phạm vi quản lý của phòng khám.
      operationId: createDoctorAssignment
      tags:
        - Doctor Assignments
      security:
        - UserBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ClinicId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDoctorAssignmentRequest'
      responses:
        '200':
          description: Phân công thành công hoặc tái kích hoạt thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoctorAssignmentDto'
        '400':
          $ref: '#/components/responses/400ValidationError'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '409':
          description: Phân công đã tồn tại và đang ACTIVE.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

    get:
      summary: Lấy danh sách phân công bác sĩ tại phòng khám
      description: |
        CLINIC_ADMIN và SYSTEM_ADMIN xem được toàn bộ.
        DOCTOR chỉ xem được danh sách phân công của chính mình.
      operationId: getDoctorAssignments
      tags:
        - Doctor Assignments
      security:
        - UserBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ClinicId'
        - name: doctorId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: patientId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [ACTIVE, REVOKED, ALL]
      responses:
        '200':
          description: Danh sách phân công bác sĩ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoctorAssignmentListResponse'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'

  /api/v1/clinics/{clinicId}/assignments/{assignmentId}:
    delete:
      summary: Thu hồi phân công bác sĩ tại phòng khám
      description: |
        Chuyển trạng thái phân công thành REVOKED (bảo toàn audit trail, không hard delete).
        Chỉ cho phép CLINIC_ADMIN của phòng khám hoặc SYSTEM_ADMIN thực hiện.
      operationId: revokeDoctorAssignment
      tags:
        - Doctor Assignments
      security:
        - UserBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ClinicId'
        - name: assignmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Thu hồi phân công thành công.
        '400':
          $ref: '#/components/responses/400ValidationError'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'

  /internal/v1/profile/camera-delegation/resolve:
    post:
      summary: Phân giải ủy quyền thiết bị camera chụp đáy mắt cho Analysis Service
      description: |
        Được gọi nội bộ bởi Analysis Service khi tiếp nhận ảnh từ NiFi Camera.
        Xác minh tính hợp lệ của grant, deviceId, clientId, servicePrincipalId, patientId, tenantId.
        Sprint 3 chỉ chấp nhận camera cho tenant PERSONAL.
      operationId: resolveCameraDelegation
      tags:
        - Profile Internal
      security:
        - ServiceTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CameraDelegationResolveRequest'
      responses:
        '200':
          description: Kết quả xác thực ủy quyền camera.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CameraDelegationResolveResponse'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          description: Service token không có scope profile:resolve.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /health:
    get:
      summary: Kiểm tra trạng thái hoạt động của dịch vụ Profile
      operationId: checkHealth
      tags:
        - Platform
      responses:
        '200':
          description: Dịch vụ đang hoạt động bình thường.
          content:
            text/plain:
              schema:
                type: string
                example: Healthy

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Firebase ID Token của người dùng.
    ServiceTokenAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Service-to-Service JWT do Identity cấp (RS256, audience aura-profile).

  parameters:
    CorrelationIdHeader:
      name: X-Correlation-Id
      in: header
      required: false
      description: Mã truy vết luồng xử lý.
      schema:
        type: string
        maxLength: 64
        example: a0000000-0000-4000-8000-000000000001

    IfMatchHeader:
      name: If-Match
      in: header
      required: true
      description: Phiên bản ETag hiện tại của hồ sơ (ví dụ "1").
      schema:
        type: string
        example: '"1"'

  headers:
    ETagHeader:
      description: Chuỗi ETag định danh phiên bản của hồ sơ ("<profileVersion>").
      schema:
        type: string
        example: '"1"'

    CorrelationIdHeader:
      description: Mã truy vết tương ứng cho phản hồi.
      schema:
        type: string

  schemas:
    ProfileDto:
      type: object
      required:
        - accountId
        - displayName
        - profileVersion
      properties:
        accountId:
          type: string
          format: uuid
          description: Định danh tài khoản người dùng nội bộ.
          example: 668c4a32-5342-4d8b-b505-07d548732120
        displayName:
          type: string
          description: Tên hiển thị người dùng.
          example: Nguyen Van Hoang
        phone:
          type: string
          nullable: true
          description: Số điện thoại liên hệ.
          example: "0912345678"
        patientId:
          type: string
          format: uuid
          nullable: true
          description: Định danh hồ sơ bệnh nhân mặc định của cá nhân.
          example: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
        personalTenantId:
          type: string
          format: uuid
          nullable: true
          description: Định danh phạm vi cá nhân (Personal Tenant).
          example: c4b81b5a-172b-426b-a25e-04f796123456
        profileVersion:
          type: integer
          description: Phiên bản hồ sơ hiện tại.
          example: 1

    UpdateProfileRequest:
      type: object
      description: Dữ liệu cập nhật hồ sơ. Không chấp nhận bất kỳ trường phân quyền nào.
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 100
          description: Tên hiển thị mới (từ 1 đến 100 ký tự).
          example: Nguyen Van Hoang (Da Cap Nhat)
        phone:
          type: string
          maxLength: 30
          nullable: true
          description: Số điện thoại mới (tối đa 30 ký tự).
          example: "0912345678"

    ProvisionProfileRequest:
      type: object
      required:
        - accountId
        - firebaseUid
        - displayName
      properties:
        accountId:
          type: string
          format: uuid
          example: 668c4a32-5342-4d8b-b505-07d548732120
        firebaseUid:
          type: string
          example: hoang_dev_1
        displayName:
          type: string
          example: Nguyen Van Hoang
        email:
          type: string
          format: email
          nullable: true
          example: hoang@example.com

    AccessResolveRequest:
      type: object
      required:
        - actorAccountId
        - patientId
        - action
      properties:
        actorAccountId:
          type: string
          format: uuid
          description: Định danh người đang thực hiện yêu cầu.
          example: 668c4a32-5342-4d8b-b505-07d548732120
        patientId:
          type: string
          format: uuid
          description: Định danh hồ sơ bệnh nhân mục tiêu.
          example: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
        clinicContextId:
          type: string
          format: uuid
          nullable: true
          description: Định danh phòng khám nếu thao tác trong ngữ cảnh phòng khám.
          example: null
        action:
          type: string
          enum: [ANALYSIS_CREATE, ANALYSIS_READ, ANALYSIS_FILE_READ, DOCTOR_REVIEW]
          example: ANALYSIS_CREATE

    AccessResolveResponse:
      type: object
      required:
        - allowed
      properties:
        allowed:
          type: boolean
          description: Cho biết người dùng có được phép thực hiện thao tác hay không.
          example: true
        accountStatus:
          type: string
          nullable: true
          example: ACTIVE
        patientId:
          type: string
          format: uuid
          nullable: true
          example: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
        tenantId:
          type: string
          format: uuid
          nullable: true
          example: c4b81b5a-172b-426b-a25e-04f796123456
        tenantKind:
          type: string
          nullable: true
          enum: [PERSONAL, CLINIC]
          example: PERSONAL
        ownerPrincipalId:
          type: string
          format: uuid
          nullable: true
          example: 668c4a32-5342-4d8b-b505-07d548732120
        billingOwner:
          $ref: '#/components/schemas/BillingOwnerDto'
        permissionVersion:
          type: integer
          example: 1

    BillingOwnerDto:
      type: object
      nullable: true
      properties:
        type:
          type: string
          enum: [ACCOUNT, CLINIC]
          example: ACCOUNT
        id:
          type: string
          format: uuid
          example: 668c4a32-5342-4d8b-b505-07d548732120

    AddClinicMemberRequest:
      type: object
      required:
        - accountId
        - role
      properties:
        accountId:
          type: string
          format: uuid
          description: �?nh danh t�i kho?n ngu?i d�ng du?c m?i/th�m v�o ph�ng kh�m.
          example: f0000000-0000-0000-0000-000000000001
        role:
          type: string
          enum: [CLINIC_ADMIN, DOCTOR, STAFF]
          description: Vai tr� du?c c?p trong ph?m vi ph�ng kh�m.
          example: DOCTOR

    ClinicMembershipDto:
      type: object
      required:
        - membershipId
        - clinicId
        - accountId
        - displayName
        - role
        - status
        - createdAt
        - updatedAt
      properties:
        membershipId:
          type: string
          format: uuid
          example: m1111111-0000-0000-0000-000000000002
        clinicId:
          type: string
          format: uuid
          example: 11111111-1111-1111-1111-111111111111
        accountId:
          type: string
          format: uuid
          nullable: true
          example: a1111111-0000-0000-0000-000000000002
        invitedEmail:
          type: string
          format: email
          nullable: true
          example: doctor.tran@auraclinic.vn
        displayName:
          type: string
          example: BS. Nh�n khoa Alpha
        role:
          type: string
          enum: [CLINIC_ADMIN, DOCTOR, STAFF]
          example: DOCTOR
        status:
          type: string
          enum: [ACTIVE, REVOKED]
          example: ACTIVE
        createdAt:
          type: string
          format: date-time
          example: "2026-10-29T10:00:00Z"
        updatedAt:
          type: string
          format: date-time
          example: "2026-10-29T10:00:00Z"

    ClinicMemberListResponse:
      type: object
      required:
        - clinicId
        - items
      properties:
        clinicId:
          type: string
          format: uuid
          example: 11111111-1111-1111-1111-111111111111
        items:
          type: array
          items:
            $ref: '#/components/schemas/ClinicMembershipDto'

    ErrorEnvelope:
      type: object
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetails'

    ErrorDetails:
      type: object
      required:
        - code
        - message
        - correlationId
        - retryable
      properties:
        code:
          type: string
          example: ERR_VALIDATION
        message:
          type: string
          example: Header If-Match không hợp lệ.
        correlationId:
          type: string
          example: a0000000-0000-4000-8000-000000000001
        retryable:
          type: boolean
          example: false

  responses:
    400BadRequest:
      description: Dữ liệu gửi lên không hợp lệ hoặc thiếu header bắt buộc.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

    401Unauthorized:
      description: Cần đăng nhập để thực hiện thao tác.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: ERR_UNAUTHORIZED
              message: Cần đăng nhập để cập nhật hồ sơ.
              correlationId: a0000000-0000-4000-8000-000000000001
              retryable: false

    500InternalError:
      description: Lỗi máy chủ hoặc cơ sở dữ liệu nội bộ.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

    CreateDoctorAssignmentRequest:
      type: object
      required:
        - doctorId
        - patientId
      properties:
        doctorId:
          type: string
          format: uuid
        patientId:
          type: string
          format: uuid

    DoctorAssignmentDto:
      type: object
      required:
        - assignmentId
        - clinicId
        - doctorId
        - doctorName
        - patientId
        - status
        - assignedAt
        - createdAt
        - updatedAt
      properties:
        assignmentId:
          type: string
          format: uuid
        clinicId:
          type: string
          format: uuid
        doctorId:
          type: string
          format: uuid
        doctorName:
          type: string
        patientId:
          type: string
          format: uuid
        status:
          type: string
          enum: [ACTIVE, REVOKED, EXPIRED]
        assignedAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    DoctorAssignmentListResponse:
      type: object
      required:
        - clinicId
        - items
      properties:
        clinicId:
          type: string
          format: uuid
        items:
          type: array
          items:
            $ref: '#/components/schemas/DoctorAssignmentDto'

    CameraDelegationResolveRequest:
      type: object
      required:
        - actorAccountId
        - patientId
        - servicePrincipalId
        - clientId
        - deviceId
        - expectedTenantId
        - action
      properties:
        actorAccountId:
          type: string
          format: uuid
        patientId:
          type: string
          format: uuid
        servicePrincipalId:
          type: string
          format: uuid
        clientId:
          type: string
        deviceId:
          type: string
        expectedTenantId:
          type: string
          format: uuid
        action:
          type: string
          example: ANALYSIS_CREATE

    CameraDelegationResolveResponse:
      type: object
      required:
        - allowed
      properties:
        allowed:
          type: boolean
        patientId:
          type: string
          format: uuid
          nullable: true
        tenantId:
          type: string
          format: uuid
          nullable: true
        tenantKind:
          type: string
          nullable: true
        ownerPrincipalId:
          type: string
          format: uuid
          nullable: true
        billingOwner:
          $ref: '#/components/schemas/BillingOwnerDto'
        grantId:
          type: string
          format: uuid
          nullable: true
        reason:
          type: string
          nullable: true

    RegisterClinicRequest:
      type: object
      required:
        - name
        - taxId
        - address
        - representativeName
      properties:
        name:
          type: string
          example: Phòng khám Đa khoa Quốc tế AURA
