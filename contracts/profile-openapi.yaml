  /internal/v1/profile/provision:
    post:
      summary: Khởi tạo hồ sơ và Personal Tenant nội bộ (Idempotent)
      description: |
        Được gọi bởi Identity Service trong quá trình bootstrap tài khoản người dùng mới.
        Tự động tạo:
        1. Một Personal Tenant (`tenant_kind = 'PERSONAL'`).
        2. Một Hồ sơ người dùng (`profile.profiles`) với `profile_version = 1`.
        3. Một Hồ sơ bệnh nhân mặc định (`profile.patients`).
        Đảm bảo tách biệt tuyệt đối 3 định danh: `accountId` != `patientId` != `personalTenantId`.
      operationId: provisionProfile
      tags:
        - Profile Internal
      security:
        - ServiceTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProvisionProfileRequest'
      responses:
        '200':
          description: Khởi tạo hồ sơ thành công hoặc trả về hồ sơ đã tồn tại.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileDto'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          description: Service token không có scope profile:provision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/500InternalError'

  /internal/v1/profile/access/resolve:
    post:
      summary: Phân giải quyền truy cập hồ sơ bệnh nhân cho Analysis Service
      description: |
        Được gọi nội bộ bởi Analysis Service trước khi tiếp nhận ảnh upload hoặc đọc kết quả phân tích.
        Hệ thống kiểm tra ngữ cảnh:
        - Ngữ cảnh chính chủ (`OWN`): actorAccountId trùng với linkedAccountId / ownerPrincipalId của bệnh nhân.
        - Phân công bác sĩ (`ASSIGNED`): actorAccountId có phân công bác sĩ (`profile.doctor_assignments`) còn hiệu lực (`ACTIVE`).
        - Ngữ cảnh phòng khám (`TENANT`): actorAccountId có membership trong phòng khám sở hữu bệnh nhân.
        Nếu không có quyền hoặc bệnh nhân không tồn tại, trả về `allowed: false` mà không làm lộ dữ liệu.
      operationId: resolveAccess
      tags:
        - Profile Internal
      security:
        - ServiceTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessResolveRequest'
      responses:
        '200':
          description: Kết quả phân giải quyền truy cập.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessResolveResponse'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          description: Service token không có scope profile:resolve.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/clinics/{clinicId}/patients:
    post:
      summary: Đăng ký hồ sơ bệnh nhân mới vào phòng khám
      description: |
        Tạo mới hồ sơ bệnh nhân nội bộ do phòng khám quản lý (CLINIC_MANAGED).
        Lưu trữ thông tin cá nhân, mã BHYT và tiền sử bệnh án (đái tháo đường, tăng huyết áp).
      operationId: registerClinicPatient
      tags:
        - Clinic Patients
      security:
        - BearerAuth: []
      parameters:
        - name: clinicId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/CorrelationIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterClinicPatientRequest'
      responses:
        '201':
          description: Đăng ký bệnh nhân thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClinicPatientDto'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          description: Không có quyền quản lý bệnh nhân tại phòng khám này.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Không tìm thấy phòng khám.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

    get:
      summary: Lấy danh sách bệnh nhân của phòng khám
      description: Truy vấn danh sách bệnh nhân thuộc phòng khám, hỗ trợ tìm kiếm theo tên hoặc mã BHYT và phân trang.
      operationId: getClinicPatients
      tags:
        - Clinic Patients
      security:
        - BearerAuth: []
      parameters:
        - name: clinicId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: search
          in: query
          required: false
          description: Từ khóa tìm kiếm họ tên hoặc mã BHYT
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
