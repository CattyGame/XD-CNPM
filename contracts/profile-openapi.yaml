openapi: 3.0.3
info:
  title: AURA Profile Service API
  description: |
    API quản lý hồ sơ cá nhân, hồ sơ bệnh nhân, cơ cấu tổ chức phòng khám và phân giải quyền truy cập cho hệ thống AURA.
    Đặc tính kỹ thuật cốt lõi:
    - Tách biệt định danh: accountId != patientId != clinicId != tenantId.
    - Chống sửa role qua Profile: Loại bỏ triệt để nguy cơ leo thang đặc quyền.
    - Optimistic Concurrency Control: Kiểm soát cập nhật xung đột bằng header If-Match và ETag ("<profileVersion>").
    - Phân giải quyền (Access Resolution): Xác định quyền thao tác ảnh đáy mắt cho Analysis Service.
  version: 1.1.0
  contact:
    name: AURA Team - Module M6 (Identity & Profile)
    url: https://github.com/CattyGame/XD-PMHDT
servers:
  - url: http://127.0.0.1:5000
    description: Qua API Gateway (Đường dẫn Public)
  - url: http://127.0.0.1:5005
    description: Trực tiếp Localhost Development
paths:
  /api/v1/profiles/me:
    get:
      summary: Xem hồ sơ cá nhân của người dùng hiện tại
      description: |
        Truy vấn thông tin hồ sơ của chính người dùng đã đăng nhập.
        Trả về header `ETag: "<profileVersion>"` phục vụ cho các thao tác cập nhật tiếp theo.
        Profile phân giải accountId qua Identity /context bằng service JWT riêng; không tự suy ra từ Firebase UID.
        Nếu tài khoản chưa hoàn tất bootstrap, trả về `409 ERR_PROFILE_NOT_READY` (`retryable: true`).
      operationId: getMyProfile
      tags:
        - Profile Public
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationIdHeader'
      responses:
        '200':
          description: Lấy hồ sơ thành công.
          headers:
            ETag:
              $ref: '#/components/headers/ETagHeader'
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationIdHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileDto'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          description: Tài khoản không ACTIVE (ERR_ACCOUNT_DISABLED).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Không thể phân giải danh tính qua Identity (ERR_IDENTITY_DEPENDENCY_UNAVAILABLE, retryable=true).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Hồ sơ chưa khởi tạo xong (đang chờ bootstrap hoặc provision).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: ERR_PROFILE_NOT_READY
              message: Hồ sơ chưa được khởi tạo. Hãy gọi bootstrap trước.
              correlationId: a0000000-0000-4000-8000-000000000001
              retryable: true

    patch:
      summary: Cập nhật thông tin hồ sơ cá nhân (Chống sửa Role & Kiểm soát ETag)
      description: |
        Chỉ cho phép cập nhật `displayName` (1-100 ký tự) và `phone` (tối đa 30 ký tự).
        Bắt buộc truyền header `If-Match` mang giá trị ETag của phiên bản hiện tại.
        Tuyệt đối không nhận các trường `role`, `roles`, `accountId`, `tenantId`, `patientId` (bảo vệ chống leo thang đặc quyền).
      operationId: updateMyProfile
      tags:
        - Profile Public
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IfMatchHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Cập nhật hồ sơ thành công. Trả về hồ sơ mới và ETag phiên bản mới.
          headers:
            ETag:
              $ref: '#/components/headers/ETagHeader'
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationIdHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileDto'
        '400':
          description: Thiếu header If-Match hoặc dữ liệu body không hợp lệ (ERR_VALIDATION).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: ERR_VALIDATION
              message: Thiếu header If-Match bắt buộc để cập nhật hồ sơ.
              correlationId: a0000000-0000-4000-8000-000000000001
              retryable: false
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          description: Tài khoản không ACTIVE (ERR_ACCOUNT_DISABLED).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Không thể phân giải danh tính qua Identity (ERR_IDENTITY_DEPENDENCY_UNAVAILABLE, retryable=true).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Không tìm thấy hồ sơ để cập nhật.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Xung đột phiên bản ETag / If-Match hoặc tài khoản chưa bootstrap (ERR_PROFILE_NOT_READY, retryable=true).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: ERR_PROFILE_VERSION_CONFLICT
              message: Phiên bản hồ sơ không khớp (xung đột dữ liệu). Hãy tải lại hồ sơ mới nhất.
              correlationId: a0000000-0000-4000-8000-000000000001
              retryable: false

  /api/v1/clinics:
    post:
      summary: Đăng ký thông tin phòng khám mới (Clinic Lifecycle)
      description: |
        Đăng ký một tổ chức y tế (phòng khám) mới vào hệ thống.
        Phòng khám ban đầu có trạng thái PENDING và chờ SYSTEM_ADMIN phê duyệt.
        Người đăng ký được tạo tenant phòng khám và được gán vai trò CLINIC_ADMIN đầu tiên.
      operationId: registerClinic
      tags:
        - Clinic Lifecycle
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterClinicRequest'
      responses:
        '201':
          description: Đăng ký phòng khám thành công (trạng thái PENDING).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClinicDto'
        '400':
          description: Dữ liệu đầu vào không hợp lệ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '409':
          description: Trùng mã số thuế hoặc thông tin phòng khám.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/500InternalError'

  /api/v1/admin/clinics/{clinicId}/status:
    patch:
      summary: Xét duyệt trạng thái phòng khám dành cho Quản trị viên hệ thống (SYSTEM_ADMIN)
      description: |
        SYSTEM_ADMIN phê duyệt hoặc chuyển trạng thái phòng khám (PENDING -> ACTIVE, SUSPENDED, REJECTED).
        Bắt buộc ghi nhận lý do xét duyệt (reason) và lưu vết audit log vào profile.clinic_audit_logs.
      operationId: updateClinicStatus
      tags:
        - Clinic Lifecycle Admin
      security:
        - BearerAuth: []
      parameters:
        - name: clinicId
          in: path
          required: true
          description: Định danh phòng khám
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/CorrelationIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateClinicStatusRequest'
      responses:
        '200':
          description: Cập nhật trạng thái phòng khám thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClinicDto'
        '400':
          description: Trạng thái không hợp lệ hoặc dữ liệu sai định dạng.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          description: Người dùng không phải SYSTEM_ADMIN.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Không tìm thấy phòng khám.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/500InternalError'

  /api/v1/clinics/{clinicId}/memberships/invite:
    post:
      summary: Mời Bác sĩ / Kỹ thuật viên vào phòng khám bằng email
      description: |
        Mời thành viên mới vào phòng khám bằng email và gán vai trò (ClinicManager, ClinicDoctor, ClinicStaff).
        Bản ghi membership được tạo ở trạng thái INVITED và sẽ tự động kích hoạt (chuyển sang ACTIVE) khi người dùng có email tương ứng đăng nhập vào hệ thống.
      operationId: inviteClinicMember
      tags:
        - Clinic Memberships
      security:
        - BearerAuth: []
      parameters:
        - name: clinicId
          in: path
          required: true
          description: Định danh phòng khám
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/CorrelationIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteClinicMemberRequest'
      responses:
        '201':
          description: Gửi lời mời thành viên thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClinicMembershipDto'
        '400':
          description: Email không hợp lệ hoặc role không được phép.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          description: Không đủ quyền quản trị phòng khám (chỉ SYSTEM_ADMIN hoặc CLINIC_ADMIN của chính phòng khám).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Không tìm thấy phòng khám.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Email đã là thành viên ACTIVE hoặc đã được mời.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/500InternalError'

