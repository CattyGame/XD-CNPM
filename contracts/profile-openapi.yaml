                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/clinics/{clinicId}/patients/{patientId}:
    get:
      summary: Xem chi tiết thông tin bệnh nhân
      description: Lấy thông tin cá nhân, mã BHYT và tiền sử bệnh án của bệnh nhân trong phòng khám.
      operationId: getClinicPatientById
