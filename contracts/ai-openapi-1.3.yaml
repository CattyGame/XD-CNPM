openapi: 3.1.0
info:
  title: AURA AI Core Analysis API
  version: 1.3.0
  description: >-
    Sprint 4-5 AI Core internal contract (v1.3.0). Adds vectorized Frangi v0.2
    inference (< 1.8s on 999x960 CPU), Vessel Tortuosity Index, Heuristic Risk
    Assessment (LOW/MODERATE/HIGH with mandatory medical disclaimer), and
    end-to-end X-Correlation-Id distributed tracing header propagation across
    all success and error responses. OCT modality remains rejected with HTTP 422
    UNSUPPORTED_MODALITY pending Sprint 6 GPU pipeline onboarding.
servers:
- url: http://ai-core:8000
paths:
  /api/v1/analyze:
    post:
      operationId: analyzeRetina
      security:
      - serviceBearer: []
      parameters:
      - $ref: '#/components/parameters/XCorrelationIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ai-request-1.3.schema.json
      responses:
        '200':
          description: >-
            Valid retinal vessel segmentation response with vessel_density,
            tortuosity_index, branching_points, and heuristic risk_assessment
            (status SUCCESS or WARNING).
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: ai-response-1.3.schema.json
        '400':
          description: Invalid Base64 or corrupted/unsupported image payload
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: ai-error.schema.json
        '401':
          description: Missing, expired, or invalid RS256 service JWT token
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: ai-error.schema.json
        '403':
          description: Insufficient audience or scope on RS256 service JWT
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: ai-error.schema.json
        '422':
          description: LOW_QUALITY_IMAGE, UNSUPPORTED_MODALITY (e.g. OCT), or schema error
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: ai-error.schema.json
        '500':
          description: Internal inference runtime failure
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: ai-error.schema.json
        '503':
          description: Service not ready (missing Frangi config or RS256 public key)
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: ai-error.schema.json
  /health:
    get:
      operationId: getHealth
      parameters:
      - $ref: '#/components/parameters/XCorrelationIdParam'
      responses:
        '200':
          description: Liveness probe only
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
  /ready:
    get:
      operationId: getReady
      parameters:
      - $ref: '#/components/parameters/XCorrelationIdParam'
      responses:
        '200':
          description: Real Frangi configuration and RS256 public signing key loaded
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
        '503':
          description: Not ready
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: ai-error.schema.json
components:
  securitySchemes:
    serviceBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    XCorrelationIdParam:
      name: X-Correlation-Id
      in: header
      required: false
      description: >-
        Distributed tracing correlation identifier propagated from Gateway /
        Analysis API / Worker. Echoed verbatim when supplied; auto-generated as
        UUIDv4 when omitted.
      schema:
        type: string
        minLength: 1
        maxLength: 128
  headers:
    XCorrelationId:
      description: Echoed or newly generated distributed tracing correlation identifier.
      required: true
      schema:
        type: string
        minLength: 1
