      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Review'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      x-roles:
      - PATIENT
      - DOCTOR
      - CLINIC_ADMIN
      x-resource-scopes:
        PATIENT: OWN
        DOCTOR: ASSIGNED
        CLINIC_ADMIN: TENANT
      description: 'Role chỉ là kiểm tra chức năng. Backend còn kiểm tra tenant đang hoạt động và OWN/ASSIGNED/TENANT
        trên từng resource. Role bị cấm trả 403; tài nguyên không tồn tại/ngoài phạm vi trả cùng 404. tenantId/ownerId/requesterId
        do client gửi không cấp quyền. SYSTEM_ADMIN không được dùng endpoint này. '
    post:
      tags:
      - Reviews
      operationId: submitReview
      summary: Bác sĩ xác nhận hoặc chỉnh sửa kết quả AI
      description: 'Role chỉ là kiểm tra chức năng. Backend còn kiểm tra tenant đang hoạt động và OWN/ASSIGNED/TENANT
        trên từng resource. Role bị cấm trả 403; tài nguyên không tồn tại/ngoài phạm vi trả cùng 404. tenantId/ownerId/requesterId
        do client gửi không cấp quyền. SYSTEM_ADMIN không được dùng endpoint này. Chỉ bác sĩ được phân công (BR-03),
        chỉ khi processingStatus là COMPLETED. Mỗi review là bản ghi riêng, version tăng dần; kết quả AI gốc không
        bị ghi đè (BR-06, ADR-008). `baseVersion` lệch: 409 ERR_CONCURRENT_REVIEW. Version review tăng theo ảnh;
        baseVersion là review hiện hành (0 nếu chưa có). Backend chọn kết quả AI hiện hành được trả trong GET analysis,
        kiểm tra trong transaction và ghi aiResultVersion. Có thay đổi kết quả AI thì không tự nhận review dựa vào
        snapshot cũ; cần workflow tái phân tích riêng. Xác nhận hoặc hiệu chỉnh đều REVIEWED; không dùng IN_REVIEW/CORRECTION_REQUIRED
        trong phiên bản này.'
      parameters:
      - $ref: '#/components/parameters/AnalysisId'
      - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewRequest'
            examples:
              approve:
                value:
                  isApproved: true
                  baseVersion: 0
              correct:
                value:
                  isApproved: false
                  baseVersion: 0
                  correctedRiskLevel: HIGH
                  doctorNotes: Có xuất huyết nhỏ ở thái dương.
                  reason: Đối chiếu ảnh gốc
      responses:
        '201':
          description: Đã ghi nhận
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      x-roles:
      - DOCTOR
      x-resource-scopes:
        DOCTOR: ASSIGNED
  /api/v1/analyses/{analysisId}/report:
    get:
      tags:
      - Reports
      operationId: getReport
      summary: Xuất báo cáo theo phạm vi quyền
      description: 'Role chỉ là kiểm tra chức năng. Backend còn kiểm tra tenant đang hoạt động và OWN/ASSIGNED/TENANT
        trên từng resource. Role bị cấm trả 403; tài nguyên không tồn tại/ngoài phạm vi trả cùng 404. tenantId/ownerId/requesterId
        do client gửi không cấp quyền. SYSTEM_ADMIN không được dùng endpoint này. PDF hoặc CSV (NFR-20). Báo cáo
        ghi phiên bản model và ngưỡng (BR-07, NFR-23).

        Bệnh nhân chỉ báo cáo của mình; bác sĩ trong phạm vi phân công; clinic trong tenant.

        '
      parameters:
      - $ref: '#/components/parameters/AnalysisId'
      - name: format
        in: query
        required: true
        schema:
          type: string
          enum:
          - pdf
          - csv
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Tệp báo cáo
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            text/csv:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      x-roles:
      - PATIENT
      - DOCTOR
      - CLINIC_ADMIN
      x-resource-scopes:
        PATIENT: OWN
        DOCTOR: ASSIGNED
        CLINIC_ADMIN: TENANT
  /api/v1/batches/{batchId}:
    get:
      tags:
      - Analyses
      operationId: getBatch
      summary: Trạng thái từng ảnh trong batch
      parameters:
      - name: batchId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Batch'
              example:
                batchId: b0000000-0000-4000-8000-000000000001
                batchStatus: IN_PROGRESS
                createdAt: '2026-10-08T03:15:00Z'
                items:
                - analysisId: 3f6c1d52-8a41-4c5e-9b0a-6d2f7a1e0001
                  fileName: fundus-01.jpg
                  processingStatus: COMPLETED
                  reviewStatus: PENDING
                  riskLevel: MODERATE
                  job:
                    jobId: a0000000-0000-4000-8000-000000000001
                    status: SUCCEEDED
                    retryCount: 0
                    attemptNo: 1
                - analysisId: 3f6c1d52-8a41-4c5e-9b0a-6d2f7a1e0002
                  fileName: fundus-02.jpg
                  processingStatus: FAILED
                  reviewStatus: NOT_REQUIRED
                  error:
                    code: ERR_TIMEOUT
                    message: Quá thời gian xử lý.
                    retryable: true
                    retryCount: 3
                  job:
                    jobId: a0000000-0000-4000-8000-000000000002
                    status: FAILED
                    retryCount: 3
                    attemptNo: 4
                summary:
                  total: 2
                  active: 1
                  succeeded: 1
                  failed: 0
                  duplicate: 0
                  byStatus:
                    PENDING: 0
                    QUEUED: 0
                    PROCESSING: 0
                    COMPLETED: 1
                    FAILED: 1
                    RETRY_READY: 0
                    LOW_QUALITY: 0
                    REJECTED: 0
                    DUPLICATE: 0
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      x-roles:
      - PATIENT
      - DOCTOR
      - CLINIC_ADMIN
      description: Role chỉ là kiểm tra chức năng. Backend còn kiểm tra tenant đang hoạt động và OWN/ASSIGNED/TENANT
        trên từng resource. Role bị cấm trả 403; tài nguyên không tồn tại/ngoài phạm vi trả cùng 404. tenantId/ownerId/requesterId
        do client gửi không cấp quyền. SYSTEM_ADMIN không được dùng endpoint này. Mỗi item có trạng thái, job và
        kết quả/lỗi riêng. Ảnh lỗi không làm hỏng các ảnh khác (PARTIAL_FAILED). batchStatus và summary được tính
        theo quy tắc Batch/BatchSummary; một batch hiện thuộc cùng bệnh nhân. Không công bố số đếm ngoài quyền actor.
      x-resource-scopes:
        PATIENT: OWN
        DOCTOR: ASSIGNED
        CLINIC_ADMIN: TENANT
  /api/v1/analyses/{analysisId}/files/{fileId}/access:
    get:
      tags:
      - Analyses
      operationId: getFileAccess
      summary: Xin quyền đọc ảnh hoặc annotation riêng tư
      description: 'Role chỉ là kiểm tra chức năng. Backend còn kiểm tra tenant đang hoạt động và OWN/ASSIGNED/TENANT
        trên từng resource. Role bị cấm trả 403; tài nguyên không tồn tại/ngoài phạm vi trả cùng 404. tenantId/ownerId/requesterId
        do client gửi không cấp quyền. SYSTEM_ADMIN không được dùng endpoint này. Backend kiểm tra tenant, ownership
        và phân công bác sĩ trên analysis rồi mới cấp URL ký có thời hạn. Không có quyền hoặc không tồn tại: 404.'
      x-roles:
      - PATIENT
      - DOCTOR
      - CLINIC_ADMIN
      parameters:
      - $ref: '#/components/parameters/AnalysisId'
      - name: fileId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileAccess'
              example:
                url: https://storage.example/signed/abc?sig=demo
                expiresAt: '2026-10-08T03:25:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      x-resource-scopes:
        PATIENT: OWN
        DOCTOR: ASSIGNED
        CLINIC_ADMIN: TENANT
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'JWT đã xác minh từ Identity: sub, tenantId và role đối với người dùng hoặc scope đối với service.
        Không tin tenant client gửi. analysis:ingest chỉ cấp cho service tạo analysis trong tenant được phép.'
  parameters:
    AnalysisId:
      name: analysisId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID ổn định cho cùng request. Phạm vi (tenantId, requesterId, key); cùng payload replay sau
        kiểm tra quyền, khác payload 409.
      schema:
        type: string
        format: uuid
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: Mã theo dõi xuyên dịch vụ. Nếu thiếu, Gateway/API tự sinh. Được trả lại trong error.correlationId
        và ghi vào event/job.correlationId.
      schema:
        type: string
        maxLength: 64
  schemas:
    ProcessingStatus:
      type: string
      enum: &id001
      - PENDING
      - QUEUED
      - PROCESSING
      - COMPLETED
      - FAILED
      - RETRY_READY
      - LOW_QUALITY
      - REJECTED
      - DUPLICATE
      description: Theo State Machine SCRUM-52 (nhóm Analysis, Analysis error, Validation).
    RiskLevel:
      type: string
      enum:
      - LOW
      - MODERATE
      - HIGH
      description: Khớp output AI của M4.
    CreateAnalysisRequest:
      type: object
      required:
      - patientId
      - images
      properties:
        patientId:
          type: string
          format: uuid
        images:
          type: array
          minItems: 1
          items:
            type: string
            format: binary
          description: 1..N ảnh đáy mắt (JPEG/PNG). Mỗi ảnh tạo một analysis riêng, cùng một batchId. Ảnh lưu object
            storage, DB chỉ giữ tham chiếu.
        modality:
          type: string
          enum:
          - FUNDUS
          default: FUNDUS
          description: Chỉ FUNDUS; OCT hoặc giá trị khác trả 400 ERR_VALIDATION trước job và hold credit.
        eyeSide:
          type: string
          enum:
          - left
          - right
          - unknown
          default: unknown
      description: Một batch của cùng patientId. Backend xác minh quan hệ bệnh nhân/principal hoặc assignment/tenant;
        không mặc định patientId = token.sub.
    AnalysisAccepted:
      type: object
      required:
      - batchId
      - items
      - createdAt
      - statusUrl
      properties:
        batchId:
          type: string
          format: uuid
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/BatchItem'
        createdAt:
          type: string
          format: date-time
        statusUrl:
          type: string
          description: URL batch; mỗi item có URL analysis riêng /api/v1/analyses/{analysisId}
    AnalysisResult:
      type: object
      required:
      - riskLevel
      - riskScore
      - confidenceScore
      - isMock
      - modelVersion
      - configVersion
      - thresholdVersion
      - disclaimer
      - version
      properties:
        riskLevel:
          $ref: '#/components/schemas/RiskLevel'
        riskScore:
          type: number
          minimum: 0
          maximum: 1
        confidenceScore:
          type: number
          minimum: 0
          maximum: 1
        metrics:
          $ref: '#/components/schemas/Metrics'
        indicators:
          type: array
          items:
            type: string
        modelVersion:
          type: string
        disclaimer:
          type: string
        isMock:
          type: boolean
          description: true khi là dữ liệu giả lập (ADR-008)
        thresholdVersion:
          type: string
          description: Phiên bản ngưỡng (NFR-23)
        annotations:
          type: array
          items:
            $ref: '#/components/schemas/FileRef'
          description: FileRef với fileId và kind. Runtime hiện chỉ tạo kind mask/overlay; kind khác dự phòng, không
            tự sinh. Annotation khớp kích thước ảnh gốc.
        configVersion:
          type: string
          description: Phiên bản cấu hình/ngưỡng áp dụng (NFR-23, ADR-008)
        version:
          type: integer
          minimum: 1
          description: Version kết quả AI theo ảnh; dùng để xác định kết quả được review.
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/Warning'
          description: Cảnh báo của kết quả hợp lệ. WARNING không tự đồng nghĩa LOW_QUALITY.
        processingTimeMs:
          type: number
          minimum: 0
          description: Ánh xạ AI processing_time_ms; chỉ thời gian component, không phải NFR toàn luồng.
        limitations:
          type: string
          description: Giới hạn nguồn AI; không biến mock thành kết quả thật.
    Analysis:
      type: object
      required:
      - analysisId
      - batchId
      - patientId
      - processingStatus
      - reviewStatus
      - createdAt
      - updatedAt
      properties:
        analysisId:
          type: string
          format: uuid
        patientId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        result:
          $ref: '#/components/schemas/AnalysisResult'
        latestReview:
          $ref: '#/components/schemas/Review'
        batchId:
          type: string
          format: uuid
        processingStatus:
          $ref: '#/components/schemas/ProcessingStatus'
        reviewStatus:
          $ref: '#/components/schemas/ReviewStatus'
        error:
          $ref: '#/components/schemas/ErrorInfo'
        existingAnalysisId:
          type: string
          format: uuid
          description: Có khi DUPLICATE
        ownerId:
          type: string
          format: uuid
          description: Principal sở hữu resource theo policy; không mặc định là requester.
        image:
          $ref: '#/components/schemas/FileRef'
        job:
          $ref: '#/components/schemas/Job'
        requesterId:
          type: string
          format: uuid
          description: Principal tạo request, được backend xác định.
    AnalysisList:
      type: object
      required:
      - items
      - page
      - pageSize
      - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Analysis'
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
    ReviewRequest:
      description: 'Hai nhánh loại trừ: xác nhận chỉ isApproved/baseVersion/doctorNotes; hiệu chỉnh bắt buộc correctedRiskLevel
        và reason có ký tự không phải khoảng trắng. Backend trim và kiểm tra quyền/version trong transaction.'
      oneOf:
      - type: object
        title: Confirm AI result
        required:
        - isApproved
        - baseVersion
        properties:
          isApproved:
            type: boolean
            enum:
            - true
            description: Xác nhận kết quả AI hiện tại.
          baseVersion:
            type: integer
            minimum: 0
            description: Phiên bản review hiện tại; lệch => 409 ERR_CONCURRENT_REVIEW.
          doctorNotes:
            type: string
            maxLength: 2000
        additionalProperties: false
      - type: object
        title: Correct AI result
        required:
        - isApproved
        - baseVersion
        - correctedRiskLevel
        - reason
        properties:
          isApproved:
            type: boolean
            enum:
            - false
            description: Bác sĩ không chấp nhận kết quả AI và thực hiện hiệu chỉnh.
          baseVersion:
            type: integer
            minimum: 0
            description: Phiên bản review hiện tại; lệch => 409 ERR_CONCURRENT_REVIEW.
          correctedRiskLevel:
            $ref: '#/components/schemas/RiskLevel'
          doctorNotes:
            type: string
            maxLength: 2000
          reason:
            type: string
            minLength: 1
            maxLength: 1000
            description: Bắt buộc khi hiệu chỉnh (ADR-008).
            pattern: \S
        additionalProperties: false
    Review:
      type: object
      required:
      - reviewId
      - analysisId
      - version
      - isApproved
      - doctorId
      - createdAt
      - aiResultVersion
      properties:
        reviewId:
          type: string
          format: uuid
        analysisId:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
        isApproved:
          type: boolean
        correctedRiskLevel:
          $ref: '#/components/schemas/RiskLevel'
        doctorNotes:
          type: string
        doctorId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        reason:
          type: string
          pattern: \S
        aiResultVersion:
          type: integer
          description: Phiên bản kết quả AI gốc được review; bản gốc không bị ghi đè
          minimum: 1
      description: Append-only, version tăng theo analysisId; tham chiếu AnalysisResult đúng ảnh. Không ghi đè AI.
        aiResultVersion không phải review version.
    Error:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          - correlationId
          - retryable
          properties:
            code:
              type: string
              description: 'Mã lỗi ERR_*. Ánh xạ tên trong State Machine (SCRUM-52): VALIDATION_ERROR=ERR_VALIDATION,
                UNAUTHORIZED=ERR_UNAUTHORIZED, FORBIDDEN=ERR_FORBIDDEN, NOT_FOUND=ERR_NOT_FOUND, IDEMPOTENCY_KEY_REUSED=ERR_IDEMPOTENCY_KEY_REUSED,
                REVIEW_VERSION_CONFLICT=ERR_CONCURRENT_REVIEW, INVALID_STATE=ERR_INVALID_STATE, TOO_MANY_REQUESTS=ERR_TOO_MANY_REQUESTS.
                Lỗi ở lớp xử lý AI: ERR_AI_FAILED, ERR_TIMEOUT, ERR_NETWORK, ERR_IMAGE_LOW_QUALITY, ERR_IMAGE_MISSING,
                ERR_INSUFFICIENT_CREDIT, ERR_DUPLICATE_REQUEST.'
            message:
              type: string
            details:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  issue:
                    type: string
            correlationId:
              type: string
            retryable:
              type: boolean
    Metrics:
      type: object
      properties:
        vesselDensity:
          type: number
        tortuosityIndex:
          type: number
        avRatio:
          type: number
        fractalDimension:
          type: number
        branchingPoints:
          type: integer
    ReviewStatus:
      type: string
      enum:
      - NOT_REQUIRED
      - PENDING
      - IN_REVIEW
      - REVIEWED
      - CORRECTION_REQUIRED
      description: Runtime v0.6 dùng NOT_REQUIRED → PENDING → REVIEWED. IN_REVIEW/CORRECTION_REQUIRED là dự phòng,
        chưa có operation; backend/fixtures không tự sinh. COMPLETED đưa về PENDING, review thành công đưa REVIEWED.
    BatchItem:
      type: object
      required:
      - analysisId
      - processingStatus
      properties:
        analysisId:
          type: string
          format: uuid
        fileName:
          type: string
        processingStatus:
          $ref: '#/components/schemas/ProcessingStatus'
        reviewStatus:
          $ref: '#/components/schemas/ReviewStatus'
        riskLevel:
          $ref: '#/components/schemas/RiskLevel'
        error:
          $ref: '#/components/schemas/ErrorInfo'
        job:
          $ref: '#/components/schemas/Job'
    Batch:
      type: object
      required:
      - batchId
      - items
      - createdAt
      - batchStatus
      - summary
      properties:
        batchId:
          type: string
          format: uuid
        items:
          type: array
          items:
            $ref: '#/components/schemas/BatchItem'
        createdAt:
          type: string
          format: date-time
        batchStatus:
          type: string
          enum:
          - IN_PROGRESS
          - COMPLETED
          - PARTIAL_FAILED
          - FAILED
          description: 'IN_PROGRESS nếu còn PENDING/QUEUED/PROCESSING/RETRY_READY hoặc FAILED còn retry. Khi tất
            cả terminal: COMPLETED nếu không có FAILED/LOW_QUALITY/REJECTED; PARTIAL_FAILED nếu có lỗi và có COMPLETED
            hoặc DUPLICATE; FAILED nếu mọi item đều lỗi. DUPLICATE là item đã được bỏ qua hợp lệ, không có nghĩa
            tạo kết quả AI mới. Summary/items chỉ gồm tài nguyên được phép thấy.'
        summary:
          $ref: '#/components/schemas/BatchSummary'
    ErrorInfo:
      type: object
      required:
      - code
      - message
      - retryable
      properties:
        code:
          type: string
          enum:
          - ERR_AI_FAILED
          - ERR_TIMEOUT
          - ERR_NETWORK
          - ERR_IMAGE_LOW_QUALITY
          - ERR_IMAGE_MISSING
          - ERR_INSUFFICIENT_CREDIT
          - ERR_UNAUTHORIZED
          - ERR_DUPLICATE_REQUEST
          - ERR_VALIDATION
          - ERR_UNSUPPORTED_MODALITY
          - ERR_CONCURRENT_REVIEW
          - ERR_IDEMPOTENCY_KEY_REUSED
        message:
          type: string
        retryable:
          type: boolean
        retryCount:
          type: integer
          description: Số retry đã thực hiện, suy ra attemptNo - 1; không phải cột Job.retry_count.
          minimum: 0
      description: Lý do khi processingStatus là FAILED, LOW_QUALITY, REJECTED hoặc DUPLICATE.
    FileRef:
      type: object
      required:
      - fileId
      - kind
      properties:
        fileId:
          type: string
          format: uuid
        kind:
          type: string
          enum:
          - original
          - mask
          - overlay
          - heatmap
          - annotated
      description: Tham chiếu tệp riêng tư; không chứa URL hay object key.
    FileAccess:
      type: object
      required:
      - url
      - expiresAt
      properties:
        url:
          type: string
          description: URL ký, hết hạn ngắn
        expiresAt:
          type: string
          format: date-time
    Job:
      type: object
      required:
      - jobId
      - status
      - retryCount
      - attemptNo
      properties:
        jobId:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - QUEUED
          - RUNNING
          - SUCCEEDED
          - FAILED
          - RETRY_READY
          - DEAD_LETTER
        retryCount:
          type: integer
          minimum: 0
        attemptNo:
          type: integer
          minimum: 1
      description: Job hiện hành/gần nhất của ảnh. Một Job = một attempt; retry tạo jobId mới. retryCount = attemptNo
        - 1.
    Warning:
      type: object
      additionalProperties: false
      required:
      - code
      - message
      properties:
        code:
          type: string
          minLength: 1
        message:
          type: string
          minLength: 1
    BatchSummary:
      type: object
      additionalProperties: false
      required:
      - total
      - active
      - succeeded
      - failed
      - duplicate
      - byStatus
      properties:
        total:
          type: integer
          minimum: 0
        active:
          type: integer
          minimum: 0
        succeeded:
          type: integer
          minimum: 0
        failed:
          type: integer
          minimum: 0
        duplicate:
          type: integer
          minimum: 0
        byStatus:
          type: object
          additionalProperties: false
          required: *id001
          properties:
            PENDING:
              type: integer
              minimum: 0
            QUEUED:
              type: integer
              minimum: 0
            PROCESSING:
              type: integer
              minimum: 0
            COMPLETED:
              type: integer
              minimum: 0
            FAILED:
              type: integer
              minimum: 0
            RETRY_READY:
              type: integer
              minimum: 0
            LOW_QUALITY:
              type: integer
              minimum: 0
            REJECTED:
              type: integer
              minimum: 0
            DUPLICATE:
              type: integer
              minimum: 0
      description: total=active+succeeded+failed+duplicate=sum(byStatus). succeeded=COMPLETED; duplicate=DUPLICATE;
        active gồm trạng thái đang chạy/chờ và FAILED retryable còn được retry; failed chỉ lỗi kết thúc FAILED/LOW_QUALITY/REJECTED.
        byStatus đếm trạng thái thô. Backend kiểm tra các invariant, JSON Schema không biểu diễn phép cộng.
  responses:
    ValidationError:
      description: Dữ liệu không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: ERR_VALIDATION
              message: Dữ liệu không hợp lệ.
              details:
              - field: image
                issue: required
              correlationId: c0ffee00-0000-4000-8000-000000000001
              retryable: false
    Unauthorized:
      description: Thiếu hoặc sai token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: ERR_UNAUTHORIZED
              message: Cần đăng nhập.
              correlationId: c0ffee00-0000-4000-8000-000000000002
              retryable: false
    Forbidden:
      description: Vai trò không được phép dùng chức năng này
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: ERR_FORBIDDEN
              message: Bạn không có quyền thực hiện thao tác này.
              correlationId: c0ffee00-0000-4000-8000-000000000003
              retryable: false
    NotFound:
      description: 'Không tồn tại, khác tenant, không phải của mình hoặc không được phân công (cùng một phản hồi,
        không phân biệt). Với tạo yêu cầu: patientId ngoài phạm vi.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: ERR_NOT_FOUND
              message: Không tìm thấy tài nguyên.
              correlationId: c0ffee00-0000-4000-8000-000000000004
              retryable: false
    Conflict:
      description: Xung đột trạng thái / idempotency / phiên bản review
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            keyReused:
              value:
                error:
                  code: ERR_IDEMPOTENCY_KEY_REUSED
                  message: Idempotency-Key đã dùng với nội dung khác.
                  correlationId: c0ffee00-0000-4000-8000-000000000005
                  retryable: false
            requestInProgress:
              value:
                error:
                  code: ERR_REQUEST_IN_PROGRESS
                  message: Yêu cầu cùng khóa đang được hoàn tất. Gửi lại cùng key và payload.
                  correlationId: c0ffee00-0000-4000-8000-000000000010
                  retryable: true
    InsufficientCredit:
      description: Không đủ credit (tính từ DB, không từ cache - BR-09)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: ERR_INSUFFICIENT_CREDIT
              message: Không đủ credit.
              correlationId: c0ffee00-0000-4000-8000-000000000006
              retryable: false
    PayloadTooLarge:
      description: Ảnh quá lớn
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: ERR_PAYLOAD_TOO_LARGE
              message: File vượt giới hạn kích thước theo policy.
              correlationId: c0ffee00-0000-4000-8000-000000000007
              retryable: false
    UnsupportedMedia:
      description: Định dạng ảnh không hỗ trợ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: ERR_UNSUPPORTED_MEDIA_TYPE
              message: Chỉ nhận ảnh JPEG hoặc PNG.
              correlationId: c0ffee00-0000-4000-8000-000000000008
              retryable: false
    TooManyRequests:
      description: Vượt giới hạn tần suất
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 0
            example: 30
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: ERR_TOO_MANY_REQUESTS
              message: Vượt giới hạn tần suất. Thử lại sau thời gian Retry-After.
              correlationId: c0ffee00-0000-4000-8000-000000000009
              retryable: true
