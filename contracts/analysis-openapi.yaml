  /api/v1/analyses/{analysisId}/retry:
    post:
      tags:
      - Analyses
      operationId: retryAnalysis
      summary: Thử lại analysis thất bại
      description: Role chỉ là kiểm tra chức năng. Backend còn kiểm tra tenant đang hoạt động và OWN/ASSIGNED/TENANT
        trên từng resource. Role bị cấm trả 403; tài nguyên không tồn tại/ngoài phạm vi trả cùng 404. tenantId/ownerId/requesterId
        do client gửi không cấp quyền. SYSTEM_ADMIN không được dùng endpoint này. Retry tự động theo policy; retry
        thủ công chỉ được nhận khi processingStatus FAILED hoặc RETRY_READY và backend xác định còn khả năng thực
        hiện. error.retryable=false của lỗi terminal không tự cho phép retry; backend kiểm tra nguyên nhân và policy
        thủ công riêng. Giữ analysisId/request_id, tạo Job attempt mới và không xóa lịch sử. Nếu reservation đã
        release, phải hỏi Billing và giữ credit lại; không capture hai lần cho cùng lần xử lý tính phí. Request
        cạnh tranh không tạo hai attempt kế tiếp; trả 409 nếu đã có attempt mới đang hoạt động.
      parameters:
      - $ref: '#/components/parameters/AnalysisId'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '202':
          description: Đã xếp hàng lại
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisAccepted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '402':
          $ref: '#/components/responses/InsufficientCredit'
      x-roles:
      - PATIENT
      - DOCTOR
      - CLINIC_ADMIN
      x-resource-scopes:
        PATIENT: OWN
        DOCTOR: ASSIGNED
        CLINIC_ADMIN: TENANT
