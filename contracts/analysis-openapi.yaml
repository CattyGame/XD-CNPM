        processingStatus là COMPLETED. `error` có khi FAILED, LOW_QUALITY, REJECTED, DUPLICATE. Không có quyền hoặc
        không tồn tại đều trả 404 (BR-02); 403 cho vai trò không được dùng chức năng.
