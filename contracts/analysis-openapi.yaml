openapi: 3.0.3
info:
  title: AURA Analysis API
  version: 0.6.0
  description: 'Hợp đồng REST Analysis v0.6.0 — dự thảo đồng bộ ERD, State Machine và ma trận quyền v0.3.

    Thay đổi so với v0.5.0: chỉ FUNDUS; review không nhận lý do toàn khoảng trắng; bổ sung version kết quả, attemptNo
    và tổng hợp batch; chuẩn hóa phạm vi idempotency.

    Đây là đặc tả triển khai, chưa chứng minh Analysis API/Worker đã chạy hoặc được nghiệm thu.

    - Một batch chứa nhiều ảnh của cùng bệnh nhân. batchId = AnalysisRequest.id; analysisId = Image.id.

    - Kết quả AI bất biến, có isMock và phiên bản nguồn; review lưu riêng theo ảnh.

    - Principal, tenant, owner, requester và patient có ý nghĩa riêng; patientId không mặc định bằng token.sub.

    - Quyền tài nguyên do Analysis API kiểm tra; SYSTEM_ADMIN không mặc định được đọc dữ liệu Analysis cá nhân.

    - Ảnh/annotation riêng tư; public trả fileId và kind, không trả object key hoặc Base64.

    - Worker gửi request_id = analysisId; retry giữ analysisId, tạo Job attempt mới.

    - Billing giữ/capture/release theo từng analysis; không release khi lỗi tạm thời còn retry. Retry thủ công sau
    release phải giữ credit lại trước khi tạo attempt.

    - Event/message giao ít nhất một lần; idempotent consumer và durable ACK. Không ghi trực tiếp bảng Billing/Identity.

    - WARNING có kết quả hợp lệ được giữ trong warnings, không tự đổi LOW_QUALITY. Ảnh kém chất lượng cần dấu hiệu
    chất lượng rõ ràng.

    - NFR toàn luồng và bảo mật backend chưa được xác minh chỉ bằng hợp đồng này.'
  x-change-notes:
  - 0.6.0 thay đổi ràng buộc và trường response bắt buộc; cập nhật fixtures/examples và thông báo các bên trước
    khi khóa baseline.
servers:
- url: http://127.0.0.1:5000
  description: Gateway trên máy chạy Compose; route Analysis cần triển khai.
- url: http://api-gateway:8080
  description: Gateway nội bộ Docker, dùng cho NiFi; không phải URL trình duyệt Windows.
tags:
- name: Analyses
- name: Reviews
- name: Reports
security:
- bearerAuth: []
paths:
  /api/v1/analyses:
    post:
      tags:
      - Analyses
      operationId: createAnalysis
      summary: Tạo yêu cầu phân tích (1..N ảnh, mỗi ảnh một analysis)
      description: 'Role chỉ là kiểm tra chức năng. Backend còn kiểm tra tenant đang hoạt động và OWN/ASSIGNED/TENANT
        trên từng resource. Role bị cấm trả 403; tài nguyên không tồn tại/ngoài phạm vi trả cùng 404. tenantId/ownerId/requesterId
        do client gửi không cấp quyền. SYSTEM_ADMIN không được dùng endpoint này. Trả 202 với batchId và danh sách
        analysisId theo từng ảnh. Bắt buộc header `Idempotency-Key`.

        Luồng: kiểm tra quyền, ảnh và credit (hỏi Billing qua API) -> lưu ảnh vào private object storage -> lưu
        analysis, job và outbox trong cùng transaction -> trả 202. Outbox publisher phát job lên hàng đợi sau đó
        (ADR-003).

        Gửi lại cùng key và cùng nội dung: trả lại phản hồi gốc (header `Idempotent-Replayed: true`), không tạo
        job hay trừ credit lần nữa (BR-10). Cùng key, nội dung khác: 409 ERR_IDEMPOTENCY_KEY_REUSED.

        Ảnh trùng (theo checksum): item có processingStatus DUPLICATE kèm existingAnalysisId.

        Idempotency được phạm vi hóa theo (tenantId, requesterId, Idempotency-Key), có unique constraint tương ứng.
        Kiểm tra quyền hiện hành trước khi replay. Requester khác cùng tenant dùng cùng key không replay dữ liệu
        người trước.

        Fingerprint là SHA-256 của metadata nghiệp vụ chuẩn hóa (patientId, modality, eyeSide) và checksum từng
        ảnh theo thứ tự request; áp mặc định trước khi tính, version hóa cách chuẩn hóa; không gồm token, correlationId
        hay timestamp. Hai request đồng thời chỉ tạo một logical resource và một reservation hợp lệ; request thua
        tranh chấp đọc phản hồi đã commit hoặc nhận 409 ERR_REQUEST_IN_PROGRESS để gửi lại cùng key.

        NiFi dùng service token có scope analysis:ingest và tenant được cấp; không dùng role DOCTOR để vượt quyền.
        Chỉ được tạo cho bệnh nhân trong tenant. JWT claim scope là danh sách phân tách bằng dấu cách; backend phải
        kiểm tra scope và quyền bệnh nhân.

        Multipart gửi repeated field images (binary JPEG/PNG), patientId (UUID), eyeSide và modality. OCT bị 400
        trước job/hold credit. accepted items thông thường ở QUEUED sau transaction chứa Job/Outbox; replay không
        biến item cũ thành DUPLICATE.'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateAnalysisRequest'
            encoding:
              images:
                contentType: image/jpeg, image/png
      responses:
        '202':
          description: Đã nhận, đang xếp hàng
          headers:
            Idempotent-Replayed:
              description: true nếu đây là phản hồi phát lại
              schema:
                type: boolean
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisAccepted'
              examples:
                accepted:
                  value:
                    batchId: b0000000-0000-4000-8000-000000000001
                    items:
                    - analysisId: 3f6c1d52-8a41-4c5e-9b0a-6d2f7a1e0001
                      fileName: fundus-01.jpg
                      processingStatus: QUEUED
                    - analysisId: 3f6c1d52-8a41-4c5e-9b0a-6d2f7a1e0002
                      fileName: fundus-02.jpg
                      processingStatus: QUEUED
                    createdAt: '2026-10-08T03:15:00Z'
                    statusUrl: /api/v1/batches/b0000000-0000-4000-8000-000000000001
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/InsufficientCredit'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMedia'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '404':
          $ref: '#/components/responses/NotFound'
      x-roles:
      - PATIENT
      - DOCTOR
      - CLINIC_ADMIN
      x-resource-scopes:
        PATIENT: OWN
        DOCTOR: ASSIGNED
        CLINIC_ADMIN: TENANT
      x-service-scopes:
      - analysis:ingest
    get:
      tags:
      - Analyses
      operationId: listAnalyses
      summary: Danh sách analysis trong phạm vi được phép
      description: Role chỉ là kiểm tra chức năng. Backend còn kiểm tra tenant đang hoạt động và OWN/ASSIGNED/TENANT
        trên từng resource. Role bị cấm trả 403; tài nguyên không tồn tại/ngoài phạm vi trả cùng 404. tenantId/ownerId/requesterId
        do client gửi không cấp quyền. SYSTEM_ADMIN không được dùng endpoint này. Phạm vi theo vai trò - bệnh nhân
        chỉ thấy của mình, bác sĩ chỉ thấy bệnh nhân được phân công, clinic admin trong tenant (BR-01..03, BR-15).
      parameters:
      - name: patientId
        in: query
        schema:
          type: string
          format: uuid
      - name: processingStatus
        in: query
        schema:
          $ref: '#/components/schemas/ProcessingStatus'
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: pageSize
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: reviewStatus
        in: query
        schema:
          $ref: '#/components/schemas/ReviewStatus'
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisList'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      x-roles:
      - PATIENT
      - DOCTOR
      - CLINIC_ADMIN
      x-resource-scopes:
        PATIENT: OWN
        DOCTOR: ASSIGNED
        CLINIC_ADMIN: TENANT
