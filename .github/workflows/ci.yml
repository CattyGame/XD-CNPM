name: AURA CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aura-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: .NET build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore AURA.sln

      - name: Build
        run: dotnet build AURA.sln --configuration Release --no-restore

      - name: Run Analysis tests
        run: >-
          dotnet test src/services/AURA.Analysis.Api.Tests/AURA.Analysis.Api.Tests.csproj
          --configuration Release --no-build --no-restore

      - name: Check upload recovery state transitions
        run: >-
          dotnet run --project tests/AURA.Analysis.JournalStateChecks/AURA.Analysis.JournalStateChecks.csproj
          --configuration Release --no-launch-profile

      - name: Check service authentication fail-closed behavior
        run: >-
          dotnet run --project tests/AURA.ServiceAuth.Checks/AURA.ServiceAuth.Checks.csproj
          --configuration Release --no-launch-profile

      - name: Check Profile identity resolver
        run: >-
          dotnet run --project tests/AURA.Profile.IdentityChecks/AURA.Profile.IdentityChecks.csproj
          --configuration Release --no-launch-profile

      - name: Check Profile clinic membership logic
        run: >-
          dotnet run --project tests/AURA.Profile.ClinicMembershipChecks/AURA.Profile.ClinicMembershipChecks.csproj
          --configuration Release --no-launch-profile

      - name: Check Profile patient doctor and camera authorization logic
        run: >-
          dotnet run --project tests/AURA.Profile.AuthorizationChecks/AURA.Profile.AuthorizationChecks.csproj
          --configuration Release --no-launch-profile

      - name: Check Profile multi-tenant authorization logic
        run: >-
          dotnet run --project tests/AURA.Profile.MultiTenantChecks/AURA.Profile.MultiTenantChecks.csproj
          --configuration Release --no-launch-profile

      - name: Check development configuration scripts
        shell: pwsh
        run: ./tests/AURA.DevEnvironment.Checks/Run-Checks.ps1

      - name: Check service identity setup
        shell: bash
        run: |
          set -euo pipefail

          dotnet run \
            --project tools/AURA.ServiceIdentity.Setup/AURA.ServiceIdentity.Setup.csproj \
            --configuration Release \
            --no-launch-profile \
            -- \
            --registry "$GITHUB_WORKSPACE/infra/service-auth/clients.example.json" \
            --output "$RUNNER_TEMP/aura-service-auth-check"

  python:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: src/ai-core

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version-file: src/ai-core/.python-version
          cache: pip
          cache-dependency-path: |
            src/ai-core/requirements.lock
            src/ai-core/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.lock -r requirements-dev.txt

      - name: Check dependencies
        run: python -m pip check

      - name: Run tests
        run: python -m pytest tests -q

  react:
    name: React lint test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: src/web/aura-web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: src/web/aura-web/.nvmrc
          cache: npm
          cache-dependency-path: src/web/aura-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  docker-smoke:
    name: Docker and Gateway checks
    needs: [dotnet, python]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Public placeholder for the isolated Billing database used by this job.
      BILLING_DB_PASSWORD: ci-placeholder-not-a-real-password

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET for service identity credentials
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Generate isolated service identity credentials
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/aura-service-auth"
          dotnet run \
            --project tools/AURA.ServiceIdentity.Setup/AURA.ServiceIdentity.Setup.csproj \
            --configuration Release \
            --no-launch-profile \
            -- \
            --registry "$GITHUB_WORKSPACE/infra/service-auth/clients.example.json" \
            --output "$output"

          identity_secret="$(jq -r '.clientSecret' "$output/clients/identity-api.json")"
          billing_secret="$(jq -r '.clientSecret' "$output/clients/billing-api.json")"
          profile_secret="$(jq -r '.clientSecret' "$output/clients/profile-api.json")"
          analysis_secret="$(jq -r '.clientSecret' "$output/clients/analysis-api.json")"
          if [[ -z "$identity_secret" || "$identity_secret" == "null" ]]; then
            echo "Failed to read generated Identity client secret." >&2
            exit 1
          fi
          if [[ -z "$billing_secret" || "$billing_secret" == "null" ]]; then
            echo "Failed to read generated Billing client secret." >&2
            exit 1
          fi
          if [[ -z "$profile_secret" || "$profile_secret" == "null" ]]; then
            echo "Failed to read generated Profile client secret." >&2
            exit 1
          fi
          if [[ -z "$analysis_secret" || "$analysis_secret" == "null" ]]; then
            echo "Failed to read generated Analysis client secret." >&2
            exit 1
          fi
          echo "::add-mask::$analysis_secret"
          echo "::add-mask::$identity_secret"
          echo "::add-mask::$billing_secret"
          echo "::add-mask::$profile_secret"
          # .NET 10 ASP.NET runtime images use APP_UID 1654.
          # Keep restrictive file modes; make the runtime UID the owner.
          sudo chown -R 1654:1654 "$output"
          printf 'AURA_SERVICE_AUTH_HOME=%s\n' "$output" >> "$GITHUB_ENV"
          printf 'IDENTITY_SERVICE_CLIENT_SECRET=%s\n' "$identity_secret" >> "$GITHUB_ENV"
          printf 'BILLING_SERVICE_CLIENT_SECRET=%s\n' "$billing_secret" >> "$GITHUB_ENV"
          printf 'PROFILE_SERVICE_CLIENT_SECRET=%s\n' "$profile_secret" >> "$GITHUB_ENV"
          printf 'ANALYSIS_SERVICE_CLIENT_SECRET=%s\n' "$analysis_secret" >> "$GITHUB_ENV"
          unset identity_secret billing_secret profile_secret analysis_secret

      - name: Validate Compose
        run: docker compose --env-file .env.example config -q

      - name: Validate development Compose
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_PATH: /tmp/aura-ci-firebase-placeholder.json
        run: |
          # Configuration validation only; no real Firebase key is used in CI.
          docker compose --env-file .env.example \
            -f compose.yaml -f compose.dev.yaml config -q

      - name: Start clean PostgreSQL and Redis
        run: docker compose --env-file .env.example up -d --wait postgres redis rabbitmq

      - name: Apply all service migrations
        shell: pwsh
        run: |
          ./scripts/dev/Initialize-AuraDevDatabase.ps1 -EnvFile .env.example
          ./scripts/dev/Initialize-AuraDevDatabase.ps1 -EnvFile .env.example

      - name: Configure isolated CI runtime logins
        shell: bash
        run: |
          # Public CI-only placeholders, matching .env.example and this job's env.
          # No developer password or existing database is used here.
          docker compose --env-file .env.example exec -T postgres \
            psql -X -v ON_ERROR_STOP=1 -U aura_dev -d aura_dev <<'SQL'
          ALTER ROLE aura_identity_app LOGIN PASSWORD 'replace_with_identity_runtime_password';
          ALTER ROLE aura_profile_app LOGIN PASSWORD 'replace_with_profile_runtime_password';
          ALTER ROLE aura_analysis_app LOGIN PASSWORD 'replace_with_analysis_runtime_password';
          ALTER ROLE aura_billing_app LOGIN PASSWORD 'ci-placeholder-not-a-real-password';
          SQL

      - name: Build and start applications
        run: |
          docker compose --env-file .env.example up \
            -d --build analysis-api api-gateway ai-core identity-api profile-api billing-api

      - name: Check M1 service wiring
        shell: pwsh
        run: |
          $ready = $false
          for ($attempt = 0; $attempt -lt 30; $attempt++) {
            try {
              ./scripts/dev/Test-AuraDevEnvironment.ps1 -SkipNotification -CheckDevelopmentBootstrap
              $ready = $true
              break
            }
            catch {
              if ($attempt -eq 29) { throw }
              Start-Sleep -Seconds 2
            }
          }
          if (-not $ready) { throw 'M1 development wiring checks did not pass.' }

      - name: Check health routing and OpenAPI
        shell: bash
        run: |
          set -euo pipefail

          request() {
            curl --fail --silent --show-error \
              --retry 30 --retry-delay 2 \
              --retry-all-errors --max-time 5 "$1"
          }

          request http://127.0.0.1:5001/health \
            | grep -qx 'Healthy'

          request http://127.0.0.1:5000/health \
            | grep -qx 'Healthy'

          request http://127.0.0.1:5000/services/analysis/health \
            | grep -qx 'Healthy'

          request http://127.0.0.1:5001/api/v1/platform/ping \
            | jq -e '.service == "AURA.Analysis.Api"'

          request http://127.0.0.1:5000/api/v1/platform/ping \
            | jq -e '.service == "AURA.Analysis.Api"'

          request http://127.0.0.1:5001/swagger/v1/swagger.json \
            | jq -e '.paths["/api/v1/platform/ping"].get != null'

      - name: Check AI Core container and mock API
        shell: bash
        run: |
          set -euo pipefail

          curl --fail --silent --show-error \
            --retry 30 --retry-delay 2 \
            --retry-all-errors --max-time 5 \
            http://127.0.0.1:8000/health \
            | jq -e '.status == "ok" and .model_loaded == false'

          curl --fail --silent --show-error \
            http://127.0.0.1:8000/openapi.json \
            | jq -e '.paths["/api/v1/analyze"].post != null'

          python3 - <<'PY'
          import base64
          import json
          import struct
          import urllib.error
          import urllib.request
          import zlib

          def chunk(kind, data):
              crc = zlib.crc32(kind + data) & 0xffffffff
              return (
                  struct.pack(">I", len(data))
                  + kind
                  + data
                  + struct.pack(">I", crc)
              )

          # Synthetic 1x1 PNG; contains no patient data.
          png = (
              b"\x89PNG\r\n\x1a\n"
              + chunk(b"IHDR", struct.pack(">IIBBBBB", 1, 1, 8, 2, 0, 0, 0))
              + chunk(b"IDAT", zlib.compress(b"\x00\x00\x80\x00"))
              + chunk(b"IEND", b"")
          )

          payload = {
              "request_id": "ci-ai-smoke",
              "modality": "FUNDUS",
              "image_base64": base64.b64encode(png).decode("ascii"),
              "include_mask": False,
              "include_overlay": False,
          }

          def post(data):
              request = urllib.request.Request(
                  "http://127.0.0.1:8000/api/v1/analyze",
                  data=json.dumps(data).encode("utf-8"),
                  headers={"Content-Type": "application/json"},
                  method="POST",
              )
              return urllib.request.urlopen(request, timeout=20)

          with post(payload) as response:
              result = json.load(response)

          assert result["request_id"] == payload["request_id"]
          assert result["status"] == "SUCCESS"
          assert result["is_mock"] is True
          assert result["model_version"] == "mock-v0.1"
          assert result["limitations"]

          payload["modality"] = "OCT"

          try:
              with post(payload):
                  pass
          except urllib.error.HTTPError as error:
              assert error.code == 422, error.code
          else:
              raise AssertionError("OCT must return HTTP 422")

          print("AI Core container, mock response and OCT rejection passed.")
          PY

      - name: Check failure and recovery
        shell: bash
        run: |
          set -euo pipefail

          docker compose --env-file .env.example stop analysis-api

          status=$(curl --silent --show-error \
            --max-time 10 --output /dev/null \
            --write-out '%{http_code}' \
            http://127.0.0.1:5000/api/v1/platform/ping)

          test "$status" = "502"

          curl --fail --silent --show-error \
            http://127.0.0.1:5000/health \
            | grep -qx 'Healthy'

          docker compose --env-file .env.example start analysis-api

          curl --fail --silent --show-error \
            --retry 30 --retry-delay 2 \
            --retry-all-errors --max-time 5 \
            http://127.0.0.1:5000/api/v1/platform/ping \
            | jq -e '.service == "AURA.Analysis.Api"'

      - name: Show logs on failure
        if: failure()
        run: |
          docker compose --env-file .env.example logs \
            --no-color --tail 150 analysis-api api-gateway ai-core identity-api profile-api billing-api postgres

      - name: Stop applications
        if: always()
        run: docker compose --env-file .env.example down

      - name: Remove temporary service identity credentials
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d "$RUNNER_TEMP/aura-service-auth" ]]; then
            sudo rm -rf -- "$RUNNER_TEMP/aura-service-auth"
          fi
